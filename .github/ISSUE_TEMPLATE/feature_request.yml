name: Feature request
description: Suggest a feature or a new port
labels: [enhancement]
body:
  - type: input
    id: plugin
    attributes:
      label: Plugin (or the JetBrains plugin to port)
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: What do you need and why
    validations:
      required: true

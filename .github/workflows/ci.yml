name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/*

      - name: Test and build every plugin
        run: |
          for d in plugins/*/; do
            [ -f "$d/Cargo.toml" ] || continue
            (cd "$d" && cargo test && cargo build --release --target wasm32-wasip2) || { echo "FAILED: $d"; exit 1; }
          done

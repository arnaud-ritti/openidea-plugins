id = "aritti.blade"
name = "Blade"
version = "0.2.0" # x-release-please-version
description = "Laravel Blade support for .blade.php files: highlighting of Blade directives, echo statements, PHP and the HTML around them, sections and pushes in the structure view, folding of directive pairs and multi-line comments, and inspections for unpaired directives and unbalanced parentheses in directive arguments."
authors = ["Arnaud Ritti <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = "Unreleased: documented that directive completion and its snippets are provided by aritti.laravel, not by this plugin. 0.1.0: 0.1.0: first release, with .blade.php file detection, highlighting, structure view and folding."
categories = ["languages"]
icon = "icon.svg"
engines.openidea = "^1.2"
# Highlighting, structure, folding and the inspections come from this component;
# it is loaded when the first Blade file is opened.
wasm = "dist/plugin.wasm"
activation = ["on-language:blade"]

[capabilities]
required = ["project.read"]
# events: the inspections run when a Blade file is opened or saved.
optional = ["events"]

[contributes.settings]
schema = "settings.schema.json"
title = "Blade"

[[contributes.languages]]
path = "languages/blade.toml"

id = "aritti.ddev"
name = "DDEV Integration"
version = "0.4.0" # x-release-please-version
description = "DDEV project controls, service links and streaming logs in Services. Requires an approved DDEV executable. Native database credentials, keyed terminals and a project execution target for PHP, Node and Composer."
authors = ["Arnaud Ritti <arnaud.ritti@gmail.com>"]
homepage = "https://github.com/arnaud-ritti/openidea-plugins/tree/main/plugins/ddev"
license = "MIT"
icon = "icon.svg"
change-notes = """\
Next release: Delete Project names the project and its path, Guided Setup shows the checklist first, the unavailable row says why and offers Help and Diagnostics, and Start, Restart and Stop are named the same everywhere. Composer runs use `ddev composer`, and Run/Test tell you when the project is not running; Services show the last DDEV status of each project window instead of running DDEV on every refresh, and Run and Test reuse a recent status; double-clicking a row without a link, or while the project is stopped, no longer shows an error; Share Project asks before putting the site on a public URL, the status bar item and project commands show only in DDEV projects, one name per action, clearer messages and shorter setting titles; the duplicate Help and Diagnostics command is gone, and clicking the DDEV status bar item opens a menu right at the item with the website and service links, Start, Restart, Stop and More Actions… (needs OpenIDEA 0.1.50). \
0.2.0: consolidated panels and native service actions. \
0.1.0: first release with Services, lifecycle controls, logs, database connections and PHP/Node/Composer run target."""
categories = ["tools"]
engines.openidea = "^1.14"
wasm = "dist/plugin.wasm"
activation = ["on-language:yaml", "on-view:ddev", "on-startup-finished", "on-schedule:60", "on-event:file-saved", "on-event:files-changed", "on-event:editor-focused"]

[capabilities]
required = ["project.read"]
# Update checks contact GitHub only with the optional network grant.
optional = ["process:ddev", "net:api.github.com", "events", "storage", "project.write", "clipboard", "database.sources"]

[[contributes.views]]
id = "ddev"
title = "DDEV"
icon = "icons/ddev.svg"
location = "services"

[[contributes.providers]]
kinds = ["completion", "diagnostics", "hover"]
languages = ["yaml"]


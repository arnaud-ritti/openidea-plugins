id = "aritti.devcontainer"
name = "Dev Container CLI"
version = "0.3.0" # x-release-please-version
description = "Creates Dev Container configurations from bundled image templates with optional cached feature selection, without running a CLI. Starts, rebuilds and stops the project's Dev Container (containers.dev) and opens a shell in it, using the devcontainer CLI. Adds a devcontainer.json template to the New menu. Requires the devcontainer CLI (npm i -g @devcontainers/cli) and Docker. The IDE itself keeps running on the host."
authors = ["Arnaud Ritti <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = "Run and Test through a registered target are refused when no dev container is running. Unreleased: Compose files referenced by devcontainer.json are checked for services without image/build, depends_on targets, literal ports and volumes shapes, and missing env_file and extends.file paths; feature ids warn on provable OCI shape errors, and options of local ./feature folders are checked against their devcontainer-feature.json types and enums (remote and dynamic values stay quiet). Diagnostics check hostRequirements value types and warn when a literal dockerComposeFile entry is missing or the service is not declared in the referenced Compose files (quiet for ${...} values, include and unparsable files). Image-template creation can select one cached versioned GHCR feature with explicit default options in the exact JSON preview; no registry fetch or installation occurs during creation. Separate finite managed Start/Rebuild CLI commands expose owned state, bounded captured output and explicit cancellation in Services while preserving terminal commands. Exact confirmation bodies refuse truncation. Configuration choice, Start/Rebuild review and configuration creation reject paths owned by another open nested project; ownership is rechecked before launch/application preparation. Discover nested Dev Container configurations, remember choices per project, and expose Choose Configuration in Tools/Services; cancelled choices start nothing and missing overrides are reported.  Resource browser moved to Services with selected-resource metadata and managed log tabs.  Dev Containers view listing the project's containers, running and stopped (docker ps -a by the devcontainer.local_folder label), with Open Shell, Stop and Start. feature id completion in the features object from the public containers.dev index, kept in plugin storage and refreshed by Dev Container: Refresh Feature List (the list is empty until that command has run once, and needs the net:containers.dev and storage permissions). Dev Container: Clone Repository and Start… clones a URL next to the project (git) and starts its container. 0.2.0: pick a configuration when several default files exist, confirm before Rebuild. Needs OpenIDEA API 1.2. 0.1.0: first release. Start, Rebuild, Open Shell and Stop commands, and devcontainer.json templates."
categories = ["tools"]
icon = "icon.svg"
engines.openidea = "^1.9"
wasm = "dist/plugin.wasm"
activation = ["on-event:file-opened", "on-event:file-saved", "on-view:containers", "on-view:run-target-review"]

[capabilities]
required = ["project.read"]
# git: Clone Repository and Start. storage: per-project configuration choices and feature cache. net:containers.dev: Refresh Feature List.
optional = ["process:devcontainer", "process:docker", "process:git", "events", "storage", "net:containers.dev"]


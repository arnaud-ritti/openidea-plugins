id = "aritti.devcontainer"
name = "Dev Container CLI"
version = "0.1.0" # x-release-please-version
description = "Starts, rebuilds and stops the project's Dev Container (containers.dev) and opens a shell in it, using the devcontainer CLI. Adds a devcontainer.json template to the New menu. Requires the devcontainer CLI (npm i -g @devcontainers/cli) and Docker. The IDE itself keeps running on the host."
authors = ["Arnaud Ritti <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = "Unreleased: Dev Containers view listing the project's containers, running and stopped (docker ps -a by the devcontainer.local_folder label), with Open Shell, Stop and Start. feature id completion in the features object from the public containers.dev index, kept in plugin storage and refreshed by Dev Container: Refresh Feature List (the list is empty until that command has run once, and needs the net:containers.dev and storage permissions). Dev Container: Clone Repository and Start… clones a URL next to the project (git) and starts its container. 0.2.0: pick a configuration when several default files exist, confirm before Rebuild. Needs OpenIDEA API 1.2. 0.1.0: first release. Start, Rebuild, Open Shell and Stop commands, and devcontainer.json templates."
categories = ["tools"]
icon = "icon.svg"
engines.openidea = "^1.2"
wasm = "dist/plugin.wasm"
activation = ["on-event:file-opened", "on-event:file-saved", "on-view:containers"]

[capabilities]
required = ["project.read", "process:devcontainer"]
# git: Clone Repository and Start. storage and net:containers.dev: the feature id list (Refresh Feature List). events: the inspections run when a devcontainer.json is opened or saved.
optional = ["process:docker", "process:git", "events", "storage", "net:containers.dev"]

[[contributes.commands]]
id = "up"
title = "Dev Container: Start Container"
category = "Dev Container"

[[contributes.commands]]
id = "rebuild"
title = "Dev Container: Rebuild Container"
category = "Dev Container"

[[contributes.commands]]
id = "shell"
title = "Dev Container: Open Shell in Container"
category = "Dev Container"

[[contributes.commands]]
id = "stop"
title = "Dev Container: Stop Container"
category = "Dev Container"

[[contributes.commands]]
id = "info"
title = "Dev Container: Show Configuration"
category = "Dev Container"

[[contributes.commands]]
id = "clone"
title = "Dev Container: Clone Repository and Start…"
category = "Dev Container"

[[contributes.commands]]
id = "refresh-features"
title = "Dev Container: Refresh Feature List"
category = "Dev Container"

[[contributes.menus]]
menu = "tools"
command = "up"

[[contributes.menus]]
menu = "tools"
command = "shell"

[[contributes.fileTemplates]]
id = "devcontainer"
name = "Dev Container Configuration"
extension = "json"
path = "templates/devcontainer.json"

[[contributes.fileTemplates]]
id = "devcontainer-node"
name = "Dev Container (Node)"
extension = "json"
path = "templates/node.json"

[[contributes.fileTemplates]]
id = "devcontainer-python"
name = "Dev Container (Python)"
extension = "json"
path = "templates/python.json"

[[contributes.fileTemplates]]
id = "devcontainer-java"
name = "Dev Container (Java)"
extension = "json"
path = "templates/java.json"

[[contributes.fileTemplates]]
id = "devcontainer-php"
name = "Dev Container (PHP)"
extension = "json"
path = "templates/php.json"

[[contributes.fileTemplates]]
id = "devcontainer-rust"
name = "Dev Container (Rust)"
extension = "json"
path = "templates/rust.json"

[[contributes.fileTemplates]]
id = "devcontainer-compose"
name = "Dev Container (Docker Compose)"
extension = "json"
path = "templates/compose.json"

[[contributes.views]]
id = "containers"
title = "Dev Containers"
icon = "icon.svg"
location = "bottom"

# The completion provider's language ids are json and jsonc; "jsonc" is unverified in the IDE.
[[contributes.providers]]
kinds = ["completion"]
languages = ["json", "jsonc"]

[contributes.settings]
title = "Dev Container CLI"
schema = "settings.schema.json"

id = "aritti.dotenv"
name = ".env files"
version = "0.4.1" # x-release-please-version
description = ".env file support: highlighting, inspections with quick fixes and ${VARIABLE} completion. Environment variables in code (getenv, os.environ, process.env, ENV[…], env::var, PHPUnit <env>, …) get completion and go to declaration in .env files, Dockerfiles and docker-compose files. Go to declaration on a key in a .env file lists its usages, and after you rename a key you can update its ${VARIABLE} references in the same file."
authors = ["Arnaud RITTI"]
license = "MIT"
change-notes = """\
Next release: Other plugins can register their own env files; Docker Compose variables and Dockerfile ARG values link to .env keys with hover details, and a gutter icon on each .env key lists its usages and the other env files declaring it; values of keys like PASSWORD, SECRET, TOKEN and KEY show as •••• in completion and hover, and .env: Show Value at Caret reveals one in a picker, never in the notification history; saving no longer re-scans the whole project, and changes made outside the editor are picked up; settings to turn checks off, single-quoted values with ${…} are no longer flagged, one name per action and clearer messages, and large projects no longer stop the plugin while it reads them. \
0.3.0: Docker ARG scope, Compose and env_file checks and more code references. \
0.2.0: plugin icon and window consolidation."""
categories = ["languages", "linters"]
icon = "icon.svg"
engines.openidea = "^1.14"
wasm = "dist/plugin.wasm"
activation = ["on-language:dotenv"]

[[extension-points]]
id = "aritti.dotenv.sources"
description = "File names other plugins want treated as env files that declare variables (role declares) or as code that reads them (role reads)"
required = ["fileName", "role"]
fields = { fileName = "string", role = "string" }

[capabilities]
# project.read: read the project's .env files, publish problems. events: check .env files when opened or saved.
required = ["project.read", "events"]
# editor.read: .env: Show Value at Caret reads the caret position.
optional = ["editor.read"]

[[contributes.commands]]
id = "show-value"
title = ".env: Show Value at Caret"
category = ".env"

# The IDE's own `dotenv` definition wins (detection, comments); this copy only
# makes the plugin the language's owner, so its highlighting is used.
[[contributes.languages]]
path = "languages/dotenv.toml"

[[contributes.providers]]
kinds = ["completion", "definition", "code-actions", "hover", "line-markers"]
languages = ["dotenv"]

[[contributes.markerIcons]]
id = "related"
icon = "icons/dotenv.svg"

[[contributes.providers]]
kinds = ["completion", "definition", "hover"]
languages = ["php", "python", "java", "kotlin", "scala", "groovy", "javascript", "typescript", "javascriptreact", "typescriptreact", "vue", "svelte", "go", "ruby", "rust", "csharp", "xml"]

[contributes.settings]
schema = "settings.schema.json"
title = ".env files"

[[contributes.providers]]
kinds = ["diagnostics"]
languages = ["dotenv", "yaml"]

[[contributes.providers]]
kinds = ["semantic-tokens"]
languages = ["dotenv"]

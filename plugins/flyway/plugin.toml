id = "aritti.flyway"
name = "Flyway Migrations"
version = "0.3.0" # x-release-please-version
description = "Flyway database migrations in OpenIDEA. Checks migration file names (V, U, R and B prefixes, version, separator, suffix, as configured in flyway.toml, flyway.conf or spring.flyway.*) and reports duplicate versions across migration locations. Copies the next migration version, runs Flyway info, validate, migrate, repair and clean (CLI or Maven) in a terminal, and completes ${…} placeholders in SQL and keys in flyway.conf and flyway.toml."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = "Unreleased: Flyway placeholder gutter markers use their own icon. Unreleased: table-to-entity navigation now covers Kotlin @Entity/@Table classes (named args, same-file const val, schema, implicit snake_case under the same Spring Boot gate) and literal orm.xml / persistence.xml mapping-file <entity><table> names, which replace annotation tables for the same class per JPA XML overriding; xml-mapping-metadata-complete, delimited-identifiers, default schema/catalog, multiple persistence units and unresolvable mapping files make annotation tables unresolved. Unreleased: migration SQL table navigation now tokenizes double-quote, backtick and bracket identifiers with doubled-delimiter escapes and matches quoted and unquoted names to entity tables (including quoted @Table names) with per-dialect case folding; the dialect comes only from an explicit datasource or Flyway JDBC URL or driver, otherwise quoted names stay unresolved. Unreleased: table-to-entity navigation resolves same-file String constants in @Table name/schema and plainly named top-level @Entity classes (CamelCase to snake_case) only under Spring Boot with no naming or quoting override; quoted, dialect and cross-file names stay unresolved. Unreleased: optional reviewed checksum-pinned Hibernate6.6.49/7.4.15 compiled metadata creation-DDL adapter with16 tested explicit dialect presets per runtime and JPA3.2 fixture coverage; trusted converters/contributors disclosed; preview-only SQL then exact atomic migration FileAction, no app bootstrap or JDBC action requested. Unreleased: parameterized Java/Kotlin migration and SQL/Java callback FileActions; qualified literal JPA table-to-entity navigation alongside migration declarations. Unreleased: literal configured placeholder delimiters and replacement disabling in project-scoped SQL completion; bounded source table navigation from migration uses to CREATE TABLE definitions, without Rename or database identity claims. Unreleased: native migration browser with source navigation, scoped Filter/Clear and reviewed Actions picker; no packaged web wrapper. Unreleased: managed comparison readiness and a tested finite Child orchestration core; runtime Start/Continue remain blocked pending an authoritative installed offline CLI profile. Existing imported SQL review stays available. Unreleased: offline local diffText JSON comparison review with selected source/target SQL definitions and an exact non-executing 13.12.1 Enterprise CLI recipe; no database diff/migration execution. Unreleased: New Migration prepares an editable naming form and read-only target preview; atomic editor FileActions create from the bundled SQL template or rename migrations after concrete confirmation and collision/staleness checks. Removed process:tee. New › Flyway SQL Migration, Java Migration, Kotlin Migration, Java Callback and SQL Callback templates; Flyway icon on V*__*.sql, U*__*.sql and R__*.sql files. Read-only cached placeholder navigation and gutter markers use one source-established Flyway configuration and owned migration locations. Incomplete table/entity and placeholder Rename graph anchors are withheld; full SQL/type resolution is not claimed. CLI commands now review bounded source provenance and unresolved target before launch; Clean always requires concrete confirmation. Cached rendering never runs Info. Managed finite output offers scoped Status/Cancel; terminal compatibility remains. 0.1.0: first release. Migration name and duplicate version checks on open and save and with Flyway: Check Migrations; Copy Next Migration Version; info, validate, migrate, repair and clean in a terminal (flyway or mvn); completion of placeholders in SQL and of keys in flyway.conf and flyway.toml."
categories = ["frameworks", "linters"]
icon = "icon.svg"
engines.openidea = "^1.9"
wasm = "dist/plugin.wasm"
activation = ["on-event:file-opened", "on-event:file-saved", "on-event:files-changed", "on-view:migrations"]

[capabilities]
required = ["project.read", "events"]
# clipboard: Copy Next Migration Version. FileActions create/rename without a process.
optional = ["clipboard", "process:flyway", "process:mvn", "process:java"]

# flyway.conf is the `ini` language, flyway.toml `toml`; the code filters by file name.
[[contributes.providers]]
kinds = ["completion", "definition", "line-markers"]
languages = ["sql", "ini", "toml"]

[[contributes.providers]]
kinds = ["code-actions"]
languages = ["sql", "ini", "toml", "properties", "yaml", "java", "kotlin"]

[[contributes.commands]]
id = "check"
title = "Flyway: Check Migrations"
category = "Flyway"

[[contributes.commands]]
id = "copy-next-version"
title = "Flyway: Copy Next Migration Version"
category = "Flyway"

[[contributes.commands]]
id = "new-migration"
title = "Flyway: New Migration…"
category = "Flyway"

[[contributes.commands]]
id = "info"
title = "Flyway: Info"
category = "Flyway"

[[contributes.commands]]
id = "validate"
title = "Flyway: Validate"
category = "Flyway"

[[contributes.commands]]
id = "migrate"
title = "Flyway: Migrate"
category = "Flyway"

[[contributes.commands]]
id = "repair"
title = "Flyway: Repair"
category = "Flyway"

[[contributes.commands]]
id = "clean"
title = "Flyway: Clean (Drops All Objects)…"
category = "Flyway"

# Root-level flyway.toml / flyway.conf only; the config file holds url and credentials.
# clean and repair stay commands with their own guard, never one-click run configurations.
# Database-writing operations remain freshly reviewed commands; never native Rerun.
[[contributes.runConfigurations]]
files = ["flyway.toml", "flyway.conf", "conf/flyway.toml", "conf/flyway.conf"]

[[contributes.documentIndexers]]
extensions = ["sql", "conf", "toml", "java", "kt"]

[[contributes.views]]
id = "migrations"
title = "Flyway"
icon = "icons/flyway.svg"
location = "bottom"
web = "web/resources/hub.html"

[[contributes.fileTemplates]]
id = "migration-sql"
name = "Flyway SQL Migration"
extension = "sql"
path = "templates/migration.sql"

[[contributes.fileTemplates]]
id = "migration-java"
name = "Flyway Java Migration"
extension = "java"
path = "templates/Migration.java"

[[contributes.fileTemplates]]
id = "migration-kotlin"
name = "Flyway Kotlin Migration"
extension = "kt"
path = "templates/Migration.kt"

[[contributes.fileTemplates]]
id = "callback-java"
name = "Flyway Java Callback"
extension = "java"
path = "templates/Callback.java"

[[contributes.fileTemplates]]
id = "callback-sql"
name = "Flyway SQL Callback"
extension = "sql"
path = "templates/callback.sql"

[[contributes.fileIcons]]
id = "migrations"
patterns = ["V*__*.sql", "U*__*.sql", "R__*.sql"]
icon = "icons/flyway.svg"

[contributes.settings]
title = "Flyway Migrations"
schema = "settings.schema.json"

[[contributes.commands]]
id = "status"
title = "Flyway: Refresh Managed Command Status"
category = "Flyway"

[[contributes.commands]]
id = "cancel"
title = "Flyway: Cancel Owned Managed Command"
category = "Flyway"

[[contributes.commands]]
id = "review-comparison"
title = "Flyway: Review Local Comparison Report..."
category = "Flyway"

[[contributes.commands]]
id = "hibernate-schema"
title = "Flyway: Generate Reviewed Offline Hibernate Schema SQL…"
category = "Flyway"

[[contributes.fileTemplates]]
id = "hibernate-profile"
name = "Offline Hibernate Schema Adapter Profile"
extension = "json"
path = "templates/hibernate-profile.json"

[[contributes.fileTemplates]]
id = "hibernate7-profile"
name = "Offline Hibernate 7 Schema Adapter Profile"
extension = "json"
path = "templates/hibernate7-profile.json"

[[contributes.markerIcons]]
id = "placeholder"
icon = "icons/marker-placeholder.svg"

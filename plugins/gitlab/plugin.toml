id = "aritti.gitlab"
name = "GitLab"
version = "0.2.0" # x-release-please-version
description = """\
gitlab.com merge requests in the IDE. List them with the IntelliJ quick filters and follow their timeline. \
Review the changes with comments on diff lines and pending reviews, then reply, resolve, approve, merge, rebase, \
close, reopen or mark as draft or ready. The status bar shows the current branch's merge request and the editor shows \
its unresolved threads. Also checks out merge request branches, clones and shares projects, opens or copies the \
GitLab link to the current lines, and creates snippets. Port of the GitLab plugin by JetBrains s.r.o. \
(org.jetbrains.plugins.gitlab 263.7307.200, intellij-community tag idea/263.7307.200, plugins/gitlab), Apache-2.0."""
authors = ["Arnaud Ritti <arnaud.ritti@gmail.com>", "JetBrains s.r.o. and contributors (original GitLab plugin)"]
homepage = "https://github.com/JetBrains/intellij-community/tree/master/plugins/gitlab"
license = "Apache-2.0"
change-notes = """\
0.2.0: Merge Request Changes tool window (diff, comments on lines, pending review, viewed files), Submit Review, \
timeline events, the current branch's merge request in the status bar and the editor, Check Out Branch, and cloning \
and sharing projects with git. \
0.1.0: first release, ported from org.jetbrains.plugins.gitlab 263.7307.200 (intellij-community idea/263.7307.200). \
gitlab.com with a personal access token: merge request list, threads and review actions, Open on GitLab and Copy Link \
for files, Create Snippet."""
categories = ["vcs"]
engines.openidea = "^1.0"
wasm = "dist/plugin.wasm"
activation = [
    "on-view:merge-requests", "on-view:merge-request", "on-view:merge-request-changes", "on-view:gitlab-projects", "on-view:new-merge-request", "on-view:new-snippet", "on-view:share-project-form", "on-view:merge-request-commits", "on-view:merge-request-pipeline",
    "on-event:vcs-changed", "on-event:file-opened", "on-event:file-saved",
    "on-file:**/.gitlab-ci.yml", "on-file:**/*.gitlab-ci.yml",
]

[capabilities]
required = ["vcs.read", "editor.read", "net:gitlab.com", "secrets", "storage"]
# clipboard: Copy Link and the snippet URL. project.read: jump to a line, review threads in the editor.
# events: the current branch's merge request. process:git: check out, clone, share.
optional = ["clipboard", "project.read", "events", "process:git"]


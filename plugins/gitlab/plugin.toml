id = "aritti.gitlab"
name = "GitLab"
version = "0.5.0" # x-release-please-version
description = """GitLab merge requests in the IDE, on gitlab.com or a self-hosted server. List them with the IntelliJ quick filters and follow their timeline. Review the changes with comments on diff lines and pending reviews, then reply, resolve, approve, merge, rebase, close, reopen or mark as draft or ready. The status bar shows the current branch's merge request and the editor shows its unresolved threads. Also checks out merge request branches, clones and shares projects, opens or copies the GitLab link to the current lines, and creates snippets."""
authors = ["Arnaud Ritti <arnaud.ritti@gmail.com>"]
homepage = "https://github.com/arnaud-ritti/openidea-plugins/tree/main/plugins/gitlab"
license = "MIT"
change-notes = """\
Next release: The status bar merge request opens a menu to show it or open it on GitLab, a Repository button picks the panel's repository, and Open on GitLab and Copy Link follow the Project view selection and the repository containing it; Details moves secondary actions into More…, says when you cannot merge, offers Share Project without a GitLab remote, and unresolved threads get their own gutter icon. Asks before sending your token to a new self-hosted server, before a fork checkout overwrites a local branch and before Rebase Merge Request (was Update Merge Request Branch), and Merge names squash and branch deletion; draft and diff comments no longer fail on unused line numbers, added and deleted files open in the diff viewer, and .gitlab-ci.yml completion and empty threads no longer crash; links to branches named with # or ? work, and glab checkout accepts any glab 1.x; row commands say what to select and stay disabled until then, and permission messages are clearer. \
0.3.0: commits, pipelines and job details with retry and cancel, snippet and merge request forms, self-hosted HTTPS servers. \
0.2.0: Merge Request window sections, distinct window icons and plugin icon."""
categories = ["vcs"]
icon = "icon.svg"
engines.openidea = "^1.14"
wasm = "dist/plugin.wasm"
activation = ["on-view:merge-requests", "on-event:vcs-changed", "on-event:file-opened", "on-event:file-saved", "on-file:**/.gitlab-ci.yml", "on-file:**/*.gitlab-ci.yml"]

[capabilities]
required = ["vcs.read", "editor.read", "net:gitlab.com", "secrets", "storage"]
# clipboard: Copy Link and the snippet URL. project.read: jump to a line, review threads in the editor,
# and find the GitLab repositories of a multi-repository workspace for the Repository picker.
# events: the current branch's merge request. process:git: check out, clone, share, and read the remotes of child repositories.
optional = ["clipboard", "project.read", "events", "process:git", "process:glab", "net:ask"]
# net:ask: a self-hosted HTTPS server set in the server setting, approved on first use.


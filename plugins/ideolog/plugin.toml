id = "aritti.ideolog"
name = "Ideolog"
version = "0.3.0" # x-release-please-version
description = "Log file viewer. Detects the log format (IntelliJ IDEA, TeamCity build log, Logcat, Loguru, pipe-separated, or your own Ideolog patterns), colours each event by level including its stack trace, folds multi-line events and lists errors and warnings in the structure view. Stack frames link to their source; F7 jumps to the source of an event and Shift+F7 to the next error."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
homepage = "https://github.com/arnaud-ritti/openidea-plugins/tree/main/plugins/ideolog"
license = "MIT"
change-notes = "Unreleased: owned bounded JVM live-tail/filter panel with secure read handles, rotation grace, cancel/expiry/source invalidation; API1.4 builtin Log folding and nested selection ranges with Extend Log Selection command. Unreleased: exact-source cached JVM timestamp/severity/category semantic tokens and reviewed source marks, UTF16 unique-range admission and lifecycle/config/source invalidation; no provider child processes or storage reads. Unreleased: optional approved-Java17+ regex/SimpleDateFormat observation snapshots with explicit locale/timezone, reviewed bounded source, cancellation/deadline, Java capture semantics and source-guarded navigation; editor providers never launch Java. Unreleased: numeric variable-width timestamp fields, k/K hour conventions, explicit UTC/GMT and GMT offsets. Unreleased: custom hh:mm:ss a timestamp parsing with AM/PM midnight/noon normalization, numeric offsets and preview/import consistency. Native Patterns table and structured forms replace the packaged web panel; enabled-state column and bidirectional pattern ordering; existing draft identities, validation and preview remain. Numeric custom level suffixes no longer become false error navigation/outline entries. ISO offsets normalized for time-gap calculations; malformed suffixes refused. Fallback source ranking excludes foreign project owners and refuses tied candidates. Jump source owner checks and strict UTF16 caret admission. Custom syntax language admission and complete-line cutoff safety. Owned bounded stack-frame definitions; ambiguous/capped candidates and invalid line numbers refuse navigation. Unreleased: semantic newline search is confined to a UTF8-safe64KiB source prefix, withholding partial cutoff lines.  built-in Log semantic requests reuse warmed configuration and check cooperative deadlines during detection/grouping and lazy event parsing.  optional paged snapshots now check cooperative Task cancellation/deadline between format regex attempts and physical event-grouping lines; no streaming or native semantic-renderer fix.  Ideolog: Highlight Selection (editor menu) adds the selected text as a highlighting pattern; Remove Custom Highlightings; the Patterns view edits a pattern in place (Edit) and reorders (Move Up). Ideolog Patterns view to add and remove custom formats and highlighting patterns without XML; status bar item naming the detected log format; timeGapSeconds setting colours the time of events that follow a long pause. 0.2.0: custom formats and highlighting patterns (Ideolog XML, lookaround supported); Jump to Source (F7) for stack frames and logging lines; Go to Next Error (Shift+F7), Go to Previous / Next Entry; Cmd+click on stack frames; Log (Ideolog) remains a manual lexical/fold/outline fallback; built-in Log owns *.log with the semantic overlay. 0.1.0: first release."
categories = ["languages", "tools"]
icon = "icon.svg"
engines.openidea = "^1.9"
wasm = "dist/plugin.wasm"
activation = ["on-language:ideolog", "on-language:log", "on-event:editor-focused", "on-event:file-opened", "on-event:file-saved", "on-event:files-changed", "on-event:settings-changed", "on-event:file-closed", "on-view:patterns"]

# Highlighting needs none; the navigation commands read the log and open files,
# the status item follows the focused editor, the Patterns view keeps its patterns in storage.
[capabilities]
optional = ["editor.read", "project.read", "events", "storage", "process:java"]

[[contributes.languages]]
path = "languages/ideolog.toml"

# Cmd+click on stack frames; also in files of the built-in Log language.
[[contributes.providers]]
kinds = ["definition"]
languages = ["ideolog", "log"]

# Built-in Log files keep their language and receive the same event/field colours.
[[contributes.providers]]
kinds = ["semantic-tokens"]
languages = ["log"]

[contributes.settings]
schema = "settings.schema.json"
title = "Ideolog"

[[contributes.views]]
id = "patterns"
title = "Ideolog"
icon = "file-log"
location = "bottom"
web = "web/resources/hub.html"

[[contributes.commands]]
id = "patterns"
title = "Ideolog: Custom Formats and Highlighting"
category = "Ideolog"

[[contributes.commands]]
id = "highlight-selection"
title = "Ideolog: Highlight Selection"
category = "Ideolog"
when = "editorFocus"

[[contributes.commands]]
id = "remove-highlightings"
title = "Ideolog: Remove Custom Highlightings"
category = "Ideolog"

[[contributes.commands]]
id = "jump-to-source"
title = "Ideolog: Jump to Source"
category = "Ideolog"
when = "editorFocus"

[[contributes.commands]]
id = "next-error"
title = "Ideolog: Go to Next Error"
category = "Ideolog"
when = "editorFocus"

[[contributes.commands]]
id = "next-warning"
title = "Ideolog: Go to Next Warning"
category = "Ideolog"
when = "editorFocus"

[[contributes.commands]]
id = "next-exception"
title = "Ideolog: Go to Next Exception"
category = "Ideolog"
when = "editorFocus"

[[contributes.commands]]
id = "next-entry"
title = "Ideolog: Go to Next Entry"
category = "Ideolog"
when = "editorFocus"

[[contributes.commands]]
id = "previous-entry"
title = "Ideolog: Go to Previous Entry"
category = "Ideolog"
when = "editorFocus"

[[contributes.keymaps]]
command = "jump-to-source"
key = "F7"

[[contributes.keymaps]]
command = "next-error"
key = "Shift+F7"

[[contributes.menus]]
menu = "editor.context"
command = "highlight-selection"

[[contributes.commands]]
id = "capture-log"
title = "Ideolog: Capture Active Log Snapshot"
category = "Ideolog"
when = "editorFocus"

[[contributes.commands]]
id = "log-snapshot"
title = "Ideolog: Open Captured Log Snapshot"
category = "Ideolog"

[[contributes.commands]]
id = "mark-log-source"
title = "Ideolog: Mark Current Log Source"
category = "Ideolog"

[[contributes.commands]]
id = "clear-log-source"
title = "Ideolog: Clear Log Source Marks"
category = "Ideolog"

[[contributes.commands]]
id = "capture-jvm"
title = "Ideolog: Capture JVM Regex and Date Observations"
category = "Ideolog"
when = "editorFocus"

[[contributes.providers]]
kinds = ["folding"]
languages = ["log"]

[[contributes.commands]]
id = "live-tail"
title = "Ideolog: Open Live Log Tail"
category = "Ideolog"

[[contributes.commands]]
id = "stop-tail"
title = "Ideolog: Stop Live Log Tail"
category = "Ideolog"

[[contributes.providers]]
kinds = ["selection-ranges"]
languages = ["log", "ideolog"]

[[contributes.commands]]
id = "extend-log-selection"
title = "Ideolog: Extend Log Selection"
category = "Ideolog"
when = "editorFocus"

id = "aritti.ideolog"
name = "Ideolog"
version = "0.5.0" # x-release-please-version
description = "Log file viewer. Detects the log format (IntelliJ IDEA, TeamCity build log, Logcat, Loguru, pipe-separated, or your own Ideolog patterns), colours each event by level including its stack trace, folds multi-line events and lists errors and warnings in the structure view. Stack frames link to their source; F7 jumps to the source of an event and Shift+F7 to the next error."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
homepage = "https://github.com/arnaud-ritti/openidea-plugins/tree/main/plugins/ideolog"
license = "MIT"
change-notes = """\
Next release: Run and Debug consoles colour ERROR and WARN words and Java or Python exception lines (a setting turns it off), and the status bar format item opens a menu of log navigation, snapshot, live tail and formats, and a Log Levels panel beside log editors counts errors, warnings, exceptions, info, debug and trace entries with previous and next buttons and filters the log snapshot by level; Highlight Selection and log navigation appear only in log files, large logs say how much is highlighted, and Remove Custom Highlightings asks first; live tail and a patterns table, and live tail no longer stops on the JVM's Picked up JAVA_TOOL_OPTIONS message, with plain confirmations, status and permission messages for live tail and JVM capture; whole logs are coloured and folded, changed patterns apply right away, and custom timestamp formats and numeric level suffixes no longer show false errors; Jump to Source searches only source files, file changes keep Mark Current Log Source marks, log commands are enabled only in log editors, and the patterns tab is now Formats and Highlighting everywhere. \
0.3.0: new hub window with live tail. \
0.2.0: plugin icon and audit improvements."""
categories = ["languages", "tools"]
icon = "icon.svg"
engines.openidea = "^1.14"
wasm = "dist/plugin.wasm"
activation = ["on-language:ideolog", "on-language:log", "on-event:editor-focused", "on-event:file-opened", "on-event:file-saved", "on-event:files-changed", "on-event:settings-changed", "on-event:file-closed", "on-view:patterns"]

# Highlighting needs none; the navigation commands read the log and open files,
# the status item follows the focused editor, the Formats and Highlighting tab keeps its patterns in storage.
[capabilities]
optional = ["editor.read", "project.read", "events", "storage", "process:java"]

[[contributes.languages]]
path = "languages/ideolog.toml"

# Cmd+click on stack frames; also in files of the built-in Log language.
[[contributes.providers]]
kinds = ["definition"]
languages = ["ideolog", "log"]

# Built-in Log files keep their language and receive the same event/field colours.
[[contributes.providers]]
kinds = ["semantic-tokens"]
languages = ["log"]

[contributes.settings]
schema = "settings.schema.json"
title = "Ideolog"

# Beside log editors; shown only with the optional editor.read grant.
[[contributes.editorPanels]]
id = "levels"
web = "web/levels.html"
width = 220
when = "editorLangId == log || editorLangId == ideolog"

[[contributes.views]]
id = "patterns"
title = "Ideolog"
icon = "file-log"
location = "bottom"
web = "web/resources/hub.html"

[[contributes.commands]]
id = "patterns"
title = "Ideolog: Formats and Highlighting"
category = "Ideolog"

[[contributes.commands]]
id = "highlight-selection"
title = "Ideolog: Highlight Selection"
category = "Ideolog"
when = "editorFocus && (editorLangId == log || editorLangId == ideolog)"

[[contributes.commands]]
id = "remove-highlightings"
title = "Ideolog: Remove Custom Highlightings"
category = "Ideolog"

[[contributes.commands]]
id = "jump-to-source"
title = "Ideolog: Jump to Source"
category = "Ideolog"
when = "editorFocus && (editorLangId == log || editorLangId == ideolog)"

[[contributes.commands]]
id = "next-error"
title = "Ideolog: Go to Next Error"
category = "Ideolog"
when = "editorFocus && (editorLangId == log || editorLangId == ideolog)"

[[contributes.commands]]
id = "next-warning"
title = "Ideolog: Go to Next Warning"
category = "Ideolog"
when = "editorFocus && (editorLangId == log || editorLangId == ideolog)"

[[contributes.commands]]
id = "next-exception"
title = "Ideolog: Go to Next Exception"
category = "Ideolog"
when = "editorFocus && (editorLangId == log || editorLangId == ideolog)"

[[contributes.commands]]
id = "next-entry"
title = "Ideolog: Go to Next Entry"
category = "Ideolog"
when = "editorFocus && (editorLangId == log || editorLangId == ideolog)"

[[contributes.commands]]
id = "previous-entry"
title = "Ideolog: Go to Previous Entry"
category = "Ideolog"
when = "editorFocus && (editorLangId == log || editorLangId == ideolog)"

[[contributes.keymaps]]
command = "jump-to-source"
key = "F7"

[[contributes.keymaps]]
command = "next-error"
key = "Shift+F7"

[[contributes.menus]]
menu = "editor.context"
command = "highlight-selection"
when = "editorLangId == log || editorLangId == ideolog"

[[contributes.commands]]
id = "capture-log"
title = "Ideolog: Capture Active Log Snapshot"
category = "Ideolog"
when = "editorFocus && (editorLangId == log || editorLangId == ideolog)"

[[contributes.commands]]
id = "log-snapshot"
title = "Ideolog: Open Captured Log Snapshot"
category = "Ideolog"

[[contributes.commands]]
id = "mark-log-source"
title = "Ideolog: Mark Current Log Source"
category = "Ideolog"
when = "editorFocus && editorLangId == log"

[[contributes.commands]]
id = "clear-log-source"
title = "Ideolog: Clear Log Source Marks"
category = "Ideolog"

[[contributes.commands]]
id = "capture-jvm"
title = "Ideolog: Capture JVM Regex and Date Observations"
category = "Ideolog"
when = "editorFocus && (editorLangId == log || editorLangId == ideolog)"

[[contributes.providers]]
kinds = ["folding"]
languages = ["log"]

[[contributes.commands]]
id = "live-tail"
title = "Ideolog: Open Live Log Tail"
category = "Ideolog"

[[contributes.commands]]
id = "stop-tail"
title = "Ideolog: Stop Live Log Tail"
category = "Ideolog"

[[contributes.providers]]
kinds = ["selection-ranges"]
languages = ["log", "ideolog"]

[[contributes.commands]]
id = "extend-log-selection"
title = "Ideolog: Extend Log Selection"
category = "Ideolog"
when = "editorFocus"

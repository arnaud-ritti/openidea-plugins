id = "aritti.ignore"
name = ".ignore"
version = "0.5.0" # x-release-please-version
description = "Support for ignore files (.gitignore, .dockerignore, .npmignore, .hgignore and 30 more). Reports duplicate, redundant, relative and malformed entries and invalid `syntax:` values, with quick fixes. Completes `syntax:` in .hgignore, opens the file an entry names on Ctrl-click and highlights ignore files the IDE does not recognise. A tool window adds github/gitignore and user templates. The status bar shows Ignored while you edit an ignored file, a notification warns about a Git project without a .gitignore, and any file gets an Add to .gitignore quick fix. Templates from github/gitignore (CC0-1.0)."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
homepage = "https://github.com/arnaud-ritti/openidea-plugins/tree/main/plugins/ignore"
license = "MIT"
change-notes = """\
Next release: Clicking Ignored in the status bar shows the rule that ignores the file, and Go to Rule (also Ignore: Go to Rule Ignoring This File) opens it. The Git scan commands and Find Unused Entries have plainer names and messages. New Ignore File creates the file directly, in the folder selected in the Project view, and Add or Unignore Selected Paths writes the picked ignore file in one step, and template pickers list recently used templates first; whitelist patterns such as `*` with `!*/` get the right Ignored status, and an unclosed [ matches nothing, as in Git; patterns with many wildcards and large ignore files no longer slow the editor down, and path completion finds folders in large projects; unused-entry hints for non-ASCII patterns, problems show once instead of twice, and .hgignore no longer calls the same glob and regexp pattern a duplicate; one name per action and clearer messages. \
0.3.0: consolidated panels and more complete duplicate and unused-entry checks. \
0.2.0: plugin icon and expanded checks."""
categories = ["vcs", "linters"]
icon = "icon.svg"
engines.openidea = "^1.14"
wasm = "dist/plugin.wasm"
activation = ["on-view:templates", "on-event:file-opened", "on-event:file-saved", "on-event:editor-focused"]

[capabilities]
required = ["project.read", "editor.read", "editor.write", "events", "storage"]
# project.write: Ignore: New Ignore File… creates the chosen file; Add/Unignore Selected Paths writes an ignore file that is not open.
optional = ["process:git", "process:python3", "vcs.read", "project.write"]

# Ignore files the IDE doesn't know yet; .gitignore, .dockerignore, .npmignore…
# are the built-in `ignore` language.
[[contributes.languages]]
path = "languages/dotignore.toml"

[[contributes.providers]]
kinds = ["completion", "definition", "line-markers"]
languages = ["ignore", "dotignore"]

# Quick fixes in ignore files, Add to .gitignore in every other file.
[[contributes.providers]]
kinds = ["code-actions"]
languages = ["*"]

[[contributes.commands]]
id = "add-selected"
title = "Ignore: Add Selected Paths to the Open Ignore File"
category = "Ignore"

[[contributes.commands]]
id = "unignore-selected"
title = "Ignore: Unignore Selected Paths in the Open Ignore File"
category = "Ignore"

[[contributes.commands]]
id = "new-file"
title = "Ignore: New Ignore File…"
category = "Ignore"

[[contributes.commands]]
id = "open-ignoring-rule"
title = "Ignore: Go to Rule Ignoring This File"
category = "Ignore"
when = "editorFocus"

[[contributes.menus]]
menu = "projectView.context"
command = "add-selected"

[[contributes.menus]]
menu = "projectView.context"
command = "unignore-selected"

[[contributes.menus]]
menu = "projectView.context"
command = "new-file"

[[contributes.menus]]
menu = "editor.context"
command = "add-selected"

[[contributes.menus]]
menu = "editor.context"
command = "unignore-selected"

[[contributes.menus]]
menu = "tools"
command = "new-file"

[[contributes.views]]
id = "templates"
title = "Ignore Templates"
icon = "file-ignored"
location = "right"
web = "web/resources/hub.html"

[contributes.settings]
title = ".ignore"
schema = "settings.schema.json"

# The ignore files the IDE has no icon for (`.gitignore` and the like already have one).
[[contributes.fileIcons]]
id = "ignore"
patterns = ["*.ignore", ".boringignore", ".chefignore", ".cvsignore", ".deployignore", ".distignore", ".ebignore", ".eleventyignore", ".flooignore", ".jpmignore", ".jshintignore", ".mtn-ignore", ".nodemonignore", ".nuxtignore", ".openapi-generator-ignore", ".p4ignore"]
icon = "icons/ignored.svg"
iconDark = "icons/ignored_dark.svg"

[[contributes.fileIcons]]
id = "ignore-more"
patterns = [".stylintignore", ".swagger-codegen-ignore", ".terraformignore", ".tfignore", ".tokeignore", ".upignore", ".vercelignore", ".yarnignore", "ignore-glob"]
icon = "icons/ignored.svg"
iconDark = "icons/ignored_dark.svg"


id = "aritti.ignore"
name = ".ignore"
version = "0.2.0" # x-release-please-version
description = "Support for ignore files (.gitignore, .dockerignore, .npmignore, .hgignore and 30 more). Reports duplicate, redundant, relative and malformed entries and invalid `syntax:` values, with quick fixes. Completes `syntax:` in .hgignore, opens the file an entry names on Ctrl-click and highlights ignore files the IDE does not recognise. A tool window adds github/gitignore and user templates. The status bar shows Ignored while you edit an ignored file, a notification warns about a Git project without a .gitignore, and any file gets an Add to .gitignore quick fix. Port of the .ignore plugin by Jakub Chrzanowski and JetBrains (mobi.hsz.idea.gitignore 4.5.7, Apache-2.0). Templates from github/gitignore (CC0-1.0)."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>", "Jakub Chrzanowski (original .ignore plugin)", "JetBrains s.r.o. (original .ignore plugin)"]
homepage = "https://github.com/JetBrains/idea-gitignore"
license = "Apache-2.0"
change-notes = "Unreleased: New Ignore File command (Project view, Tools) that creates a dot-named ignore file of the chosen type through tee (clipboard fallback when denied); Unignore Selected Paths command; both commands also in the editor context menu (the current file when nothing is selected); results are notifications instead of dropped return strings. path completion of entries in glob-syntax ignore files (visible files and folders only). Add Selected Paths asks which ignore file (the open one or a root .gitignore, .dockerignore…) to add to; a file that is not open is opened first and the command run again. 0.2.0: Add Selected Paths to the Open Ignore File in the Project view menu. Needs OpenIDEA API 1.2. 0.1.0: first release, ported from .ignore 4.5.7 (JetBrains/idea-gitignore commit 860a6855) with github/gitignore templates at 53cf2971. Not ported because the plugin API has no equivalent: directory gutter markers, path completion, Close Ignored Editors, hiding ignored files in the Project view."
categories = ["vcs", "linters"]
icon = "icon.svg"
engines.openidea = "^1.2"
wasm = "dist/plugin.wasm"
activation = ["on-event:file-opened", "on-event:file-saved", "on-event:editor-focused"]

[capabilities]
required = ["project.read", "editor.read", "editor.write", "events", "storage"]
optional = ["process:tee", "clipboard"]

# Ignore files the IDE doesn't know yet; .gitignore, .dockerignore, .npmignore…
# are the built-in `ignore` language.
[[contributes.languages]]
path = "languages/dotignore.toml"

[[contributes.providers]]
kinds = ["completion", "definition"]
languages = ["ignore", "dotignore"]

# Quick fixes in ignore files, Add to .gitignore in every other file.
[[contributes.providers]]
kinds = ["code-actions"]
languages = ["*"]

[[contributes.commands]]
id = "add-selected"
title = "Add Selected Paths to the Open Ignore File"
category = "Ignore"

[[contributes.commands]]
id = "unignore-selected"
title = "Unignore Selected Paths in the Open Ignore File"
category = "Ignore"

[[contributes.commands]]
id = "new-file"
title = "New Ignore File"
category = "Ignore"

[[contributes.menus]]
menu = "projectView.context"
command = "add-selected"

[[contributes.menus]]
menu = "projectView.context"
command = "unignore-selected"

[[contributes.menus]]
menu = "projectView.context"
command = "new-file"

[[contributes.menus]]
menu = "editor.context"
command = "add-selected"

[[contributes.menus]]
menu = "editor.context"
command = "unignore-selected"

[[contributes.menus]]
menu = "tools"
command = "new-file"

[[contributes.views]]
id = "templates"
title = "Ignore Templates"
icon = "file-ignored"
location = "right"

[contributes.settings]
title = ".ignore"
schema = "settings.schema.json"

# The ignore files the IDE has no icon for (`.gitignore` and the like already have one).
[[contributes.fileIcons]]
id = "ignore"
patterns = ["*.ignore", ".boringignore", ".chefignore", ".cvsignore", ".deployignore", ".distignore", ".ebignore", ".eleventyignore", ".flooignore", ".jpmignore", ".jshintignore", ".mtn-ignore", ".nodemonignore", ".nuxtignore", ".openapi-generator-ignore", ".p4ignore"]
icon = "icons/ignored.svg"
iconDark = "icons/ignored_dark.svg"

[[contributes.fileIcons]]
id = "ignore-more"
patterns = [".stylintignore", ".swagger-codegen-ignore", ".terraformignore", ".tfignore", ".tokeignore", ".upignore", ".vercelignore", ".yarnignore", "ignore-glob"]
icon = "icons/ignored.svg"
iconDark = "icons/ignored_dark.svg"

[[contributes.fileTemplates]]
id = "gitignore"
name = "Ignore File"
extension = "ignore"
path = "file-templates/gitignore"

id = "aritti.jpa-assist"
name = "JPA Assist"
version = "0.1.0" # x-release-please-version
description = "JPA and Spring Data support for Java and Kotlin. Checks entities and repositories and offers quick fixes, completes derived query methods, generates equals/hashCode and toString, copies an entity's DDL (PostgreSQL or MySQL) or DTO, copies an entity from a CREATE TABLE statement, lists entities in a JPA Structure tool window and adds New › JPA Entity and Spring Data Repository templates."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = "Unreleased: New checks: entity graph names (@EntityGraph and getEntityGraph against @NamedEntityGraph, attributePaths against the repository entity), missing setters with property access, association targets that are not entities; persistence.xml property name and value completion; New Entity writes the file next to the focused one when process:tee is allowed. Earlier in this release: attribute signatures (two associations on one attribute, an association on a basic or collection type, @Id with @EmbeddedId, getter and field annotations mixed), listener without a public no-arg constructor, the kotlin-jpa compiler plugin read from the build files (missing, with a quick fix that edits build.gradle(.kts); redundant no-arg constructor; redundant open under allopen), attribute names in @AttributeOverride, @MapsId, @MapKey and @NamedAttributeNode, :parameters of @Query and unknown named queries, persistence.xml and orm.xml values and classes (with class name completion in <class>), and an Add inverse attribute action on ManyToOne, OneToOne and ManyToMany. New Entity (class name, table, ID strategy, auditing, version, equals/hashCode; copied, and written into an empty file in focus) and New Attribute (type or association, cascade, fetch, nullability; added to the end of the entity class with its imports) commands. 0.2.0: Copy DDL and Copy DTO show only in entity files and Copy Entity only in SQL files with a CREATE TABLE; right-click an entity in JPA Structure to copy its DDL or DTO; Copy DDL asks for the SQL dialect, Copy DTO for the fields, Copy Entity for the language (the settings are the defaults); needs OpenIDEA 1.2. 0.2.0: derived query completion and checks in Spring Data repositories, a check of the repository id type, Generate equals() and hashCode() and Generate toString() actions, Copy DDL (current entity or all entities), Copy DTO, Copy Entity from CREATE TABLE and the JPA Structure tool window. 0.1.0: first release, with entity checks on open and save, quick fixes that make associations lazy, replace @Data and remove final from entity classes, and entity and repository templates."
categories = ["frameworks", "linters"]
icon = "icon.svg"
engines.openidea = "^1.2"
wasm = "dist/plugin.wasm"
activation = ["on-event:file-opened", "on-event:file-saved", "on-view:structure"]

[capabilities]
required = ["events", "project.read", "editor.read", "storage"]
optional = ["clipboard", "editor.write", "process:tee"]

[[contributes.providers]]
kinds = ["completion", "code-actions", "line-markers"]
languages = ["java", "kotlin", "xml"]

[[contributes.views]]
id = "structure"
title = "JPA Structure"
icon = "database"
location = "left"

[[contributes.commands]]
id = "copy-ddl"
title = "JPA: Copy DDL of Current Entity"
category = "JPA Assist"

[[contributes.commands]]
id = "copy-ddl-all"
title = "JPA: Copy DDL of All Entities"
category = "JPA Assist"

[[contributes.commands]]
id = "copy-dto"
title = "JPA: Copy DTO of Current Entity"
category = "JPA Assist"

[[contributes.commands]]
id = "copy-entity"
title = "JPA: Copy Entity from CREATE TABLE at Caret"
category = "JPA Assist"

[[contributes.commands]]
id = "new-entity"
title = "JPA: New Entity"
category = "JPA Assist"

[[contributes.commands]]
id = "new-attribute"
title = "JPA: New Attribute"
category = "JPA Assist"

[[contributes.menus]]
menu = "tools"
command = "copy-ddl-all"

[[contributes.menus]]
menu = "tools"
command = "new-entity"

[[contributes.menus]]
menu = "editor.context"
command = "new-attribute"
when = "(editorLangId == java || editorLangId == kotlin) && plugin.aritti.jpa-assist.isEntity"

[[contributes.menus]]
menu = "editor.context"
command = "copy-ddl"
when = "(editorLangId == java || editorLangId == kotlin) && plugin.aritti.jpa-assist.isEntity"

[[contributes.menus]]
menu = "editor.context"
command = "copy-dto"
when = "(editorLangId == java || editorLangId == kotlin) && plugin.aritti.jpa-assist.isEntity"

[[contributes.menus]]
menu = "editor.context"
command = "copy-entity"
when = "editorLangId == sql && plugin.aritti.jpa-assist.hasCreateTable"

[[contributes.menus]]
menu = "viewItem.context"
view = "structure"
command = "copy-ddl"
when = "viewItemKind == entity"

[[contributes.menus]]
menu = "viewItem.context"
view = "structure"
command = "copy-dto"
when = "viewItemKind == entity"

[contributes.settings]
title = "JPA Assist"
schema = "settings.schema.json"

[[contributes.fileTemplates]]
id = "entity-java"
name = "JPA Entity"
extension = "java"
path = "templates/Entity.java"

[[contributes.fileTemplates]]
id = "repository-java"
name = "Spring Data Repository"
extension = "java"
path = "templates/Repository.java"

[[contributes.fileTemplates]]
id = "entity-kotlin"
name = "JPA Entity (Kotlin)"
extension = "kt"
path = "templates/Entity.kt"

[[contributes.fileTemplates]]
id = "repository-kotlin"
name = "Spring Data Repository (Kotlin)"
extension = "kt"
path = "templates/Repository.kt"

id = "aritti.kube-explorer"
name = "Kube Explorer"
version = "0.3.0" # x-release-please-version
description = "Browse a Kubernetes cluster with kubectl. Switch context and namespace, list workloads, services, config, storage, events and nodes, then describe a resource, edit its YAML with schema completion and explicit reviewed apply, stream its logs, open a shell, attach, forward ports or delete it. Commands on the open file apply, validate (server dry run), diff or delete a manifest, render or apply a Kustomization, and run helm template, lint and dependency update. Never changes your kubeconfig."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = "Gutter markers use package icons. Unreleased: local CRD schema validation now reports unknown fields the API server would prune (respecting x-kubernetes-preserve-unknown-fields, additionalProperties and embedded resources), validates x-kubernetes-int-or-string, reports null on a non-nullable field as Info (dropped, or replaced by its default; nullable: true keeps null) and flags metadata.namespace on cluster-scoped CRDs; ambiguous versions and composition keywords stay quiet. Unreleased: Helm include/template navigation to define/block names, with/range scope awareness for .Values and $.Values navigation, unresolved includes reported as Info. Unreleased: Kustomization inline patches/replacements target and select selectors (kind, name, namespace, group, version, plain labelSelector/annotationSelector) link to resources listed in the same kustomization, replacement fieldPath(s) link to literal keys, selectors matching none of fully local parsable resources show an Info, local resources/bases/components directories report a missing kustomization or a bounded-depth cycle, and helmCharts valuesFile navigates to the local file; regex, remote, generated, indexed and dynamic forms stay quiet. Unreleased: label-key Rename now edits single-line quoted YAML keys with '' or basic double-quote escapes when the scanned text round-trips to the parsed value; multiline, block, anchored, tagged and \\u-escaped scalars stay refused. Unreleased: Kustomize configMapGenerator/secretGenerator files, envs and env plus replacements path references and Helm template .Values.a.b literal paths navigate to exact local files and values.yaml keys; remote, dynamic, quoted-key, flow and merge forms stay unlinked. Unreleased: label graph links exact node affinity (matchExpressions), pod affinity/anti-affinity and topology spread labelSelector terms; namespaces, namespaceSelector, matchLabelKeys, matchFields and Gt/Lt terms stay unmodeled. Unreleased: disconnected private kubeconfig import admits bracketed HTTPS IPv6 server literals without auth execution or activation; Unreleased: explicitly cached namespace/kind-scoped cluster resource reference completion without provider kubectl; Unreleased: numbered native-bounded parts for large revealed Secret display values; Unreleased: parsed schema modeline scalars, bounded ambiguity guards and source CRLF retention; Unreleased: preserve parsed item values in List/document refactors and withhold discarded wrapper metadata; Unreleased: parsed Chart.yaml source scopes and validated dependency insertion eligibility; Unreleased: preserve comments after plain Helm repository URLs with literal quotes; Unreleased: coherent successful panel mode replacement and retained unsaved Secret form navigation; Unreleased: owned structural tree callbacks and forwarding-intent epoch retirement; owner-bound context/namespace choices and bounded native field/tree control identities; per-instance rich form, preview, selection and delete-confirmation callback correlation; strict Secret response/base64 and failed-diagnostic handling; Helm release/alias value integrity; invocation-scoped process cwd with RAII restoration, editor-owner checks and opaque resource row epochs; malformed discovery cannot become CLI options. Unreleased: project-owned rich log capture/read/refresh share the project cwd and withhold raw failure output. Unreleased: bounded UTC log time-prefix validation preserves accepted filters and avoids Unicode slicing panics. Unreleased: owned forwarding scope/discovery/revalidation now share the project cwd with managed launch; closed-owner metadata reads refuse global fallback. Unreleased ownership audit: automatic resource Rename graph gated until reference closure/deployment identity are proved; exact resource associations now use bounded private read-only definition/gutter providers, including Ingress TLS Secrets and metadata namespaces. Unreleased: owned loopback port-forward start/status/stop/restart, pinned context/namespace and validated port mappings. Resource browser moved to Services with selected-resource metadata and managed log tabs.  Fixed: YAML of a Secret opens in the panel and is never written to a temp file (tee created it readable by every local user). YAML opens in the panel by default; yamlInEditor optionally uses private SDK-storage copies for supported built-ins, local-only Save and explicit Review then fresh Apply Reviewed commands. UID/resourceVersion are retained; process:tee and background autosave replacement are removed. Download Logs no longer suggests a path in /tmp. Reload Manifest from Cluster (command, optional editor.write), Log Viewer: Until, Time and Source fields, Scroll to end, Clear and Download (optional project.write), missing-key and invalid-value hints (required keys, enums, integer and boolean fields, switches checkRequiredKeys and checkFieldValues), more kinds and groups known, non-editable and deprecated kinds, and gutter markers cover the whole project and need the optional project.read (none without it or in an untrusted project). Helm repo alias quick fixes stay empty until Read Helm Repositories has run once. Earlier in this release: Edit Secret (a form of the decoded keys, saved with kubectl replace), Log Viewer (a filtered snapshot of kubectl logs: text or regex, case, start time, wrap, copy), k* manifest abbreviations and Helm .Values and include completion, problems for unknown or deprecated keys, unknown kinds and server-owned fields of core, apps, batch, networking and rbac kinds, hints for .Values paths and includes that the chart does not define, Chart.yaml quick fixes (add a dependency, repository URL or alias), several kubeconfig files with Choose Kubeconfig, notifySuccess and nonKubernetesGlobs settings, Telepresence Connect and Quit, and gutter markers between a resource and the manifests that use it. Also: Create Helm Chart, Configure Helm Parameters (release, values file, --set for template and lint), Customize Namespaces, Select Log Sources (pick pods or containers), a Debug image prompt with recent images (Edit Recent Debug Images), and Go to Declaration between manifests (names of ConfigMaps, Secrets, Services, claims and service accounts). 0.2.0: right-click a resource in the tree for describe, YAML, logs, shell, attach, debug, port forward, show secret and delete (asks to confirm); needs OpenIDEA 1.2. 0.1.0: first release. Cluster tree; describe; YAML in an editor that applies on save, with the Kubernetes schema; logs (pods and workloads), shell, attach, port forward; delete; apply, dry run, diff and delete of the open manifest; Kustomize render and apply; Helm template, lint and dependency update."
categories = ["tools"]
icon = "icon.svg"
engines.openidea = "^1.9"
wasm = "dist/plugin.wasm"
activation = ["on-view:kube", "on-view:resource-details", "on-event:file-opened", "on-event:file-saved", "on-event:files-changed"]

[capabilities]
required = ["storage"]
# Reload from Cluster edits the open file. Private YAML copies use storage; reviewed apply additionally needs editor.read and kubectl.
# Helm commands run helm; finding the chart around the open file reads the project.
# events + project.read: manifest problems on open and save (silently off without them).
optional = ["process:kubectl", "editor.read", "events", "project.read", "project.write", "editor.write", "process:helm", "process:telepresence", "clipboard"]


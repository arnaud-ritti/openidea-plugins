id = "aritti.kube-explorer"
name = "Kube Explorer"
version = "0.5.0" # x-release-please-version
description = "Browse a Kubernetes cluster with kubectl. Switch context and namespace, list workloads, services, config, storage, events and nodes, then describe a resource, edit its YAML with schema completion and explicit reviewed apply, stream its logs, open a shell, attach, forward ports or delete it. Commands on the open file apply, validate (server dry run), diff or delete a manifest, render or apply a Kustomization, and run helm template, lint and dependency update. Never changes your kubeconfig."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = """\
Next release: The status bar shows the current context and namespace with a menu to switch them, Switch Context or Namespace picks from the palette, Apply Copied YAML applies a copied manifest after naming it and the target, Diff Manifest with Cluster uses a server dry run, Apply success offers Show in Kube Explorer, and Open Shell and Attach reuse the pod's open terminal; Apply, Delete, Delete Manifest Resources, panel YAML Apply and Secret Save ask first and name the context, namespace and target, and Apply can show the diff and then apply; kubectl failures name the context and a reason, and a missing current context offers Choose Kubeconfig; validation reports unknown fields in custom resources, manifest problems stay in place while you type, label gutter icons with several matches open a chooser, imported kubeconfigs can be used and deleted, and watch survives malformed events; port forward and watch start after one confirmation, Reload from Cluster keeps Secret values out unless Show Secret is allowed, and messages, panels and setting titles use plain names. \
0.3.0: consolidated panels, label graph and native service actions. \
0.2.0: plugin icon and window consolidation."""
categories = ["tools"]
icon = "icon.svg"
engines.openidea = "^1.14"
wasm = "dist/plugin.wasm"
activation = ["on-view:kube", "on-view:resource-details", "on-event:file-opened", "on-event:file-saved", "on-event:files-changed"]

[capabilities]
required = ["storage"]
# Reload from Cluster edits the open file. Private YAML copies use storage; reviewed apply additionally needs editor.read and kubectl.
# Helm commands run helm; finding the chart around the open file reads the project.
# clipboard.read: Apply Copied YAML reads the manifest you copied, only when you run it.
# events + project.read: manifest problems on open and save (silently off without them).
optional = ["process:kubectl", "editor.read", "events", "project.read", "project.write", "editor.write", "process:helm", "process:telepresence", "clipboard", "clipboard.read"]


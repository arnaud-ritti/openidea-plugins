id = "aritti.kube-explorer"
name = "Kube Explorer"
version = "0.1.0" # x-release-please-version
description = "Browse a Kubernetes cluster with kubectl. Switch context and namespace, list workloads, services, config, storage, events and nodes, then describe a resource, edit its YAML with schema completion (saving applies it), stream its logs, open a shell, attach, forward ports or delete it. Commands on the open file apply, validate (server dry run), diff or delete a manifest, render or apply a Kustomization, and run helm template, lint and dependency update. Never changes your kubeconfig."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT AND Apache-2.0"
change-notes = "Unreleased: Fixed: YAML of a Secret opens in the panel and is never written to a temp file (tee created it readable by every local user). YAML of every other resource now opens in the panel too; the editor on a temp file is the new off-by-default setting yamlInEditor. Download Logs no longer suggests a path in /tmp. Reload Manifest from Cluster (command, optional editor.write), Log Viewer: Until, Time and Source fields, Scroll to end, Clear and Download (optional tee), missing-key and invalid-value hints (required keys, enums, integer and boolean fields, switches checkRequiredKeys and checkFieldValues), more kinds and groups known, non-editable and deprecated kinds, and gutter markers cover the whole project and need the optional project.read (none without it or in an untrusted project). Helm repo alias quick fixes stay empty until Read Helm Repositories has run once. Earlier in this release: Edit Secret (a form of the decoded keys, saved with kubectl replace), Log Viewer (a filtered snapshot of kubectl logs: text or regex, case, start time, wrap, copy), k* manifest abbreviations and Helm .Values and include completion, problems for unknown or deprecated keys, unknown kinds and server-owned fields of core, apps, batch, networking and rbac kinds, hints for .Values paths and includes that the chart does not define, Chart.yaml quick fixes (add a dependency, repository URL or alias), several kubeconfig files with Choose Kubeconfig, notifySuccess and nonKubernetesGlobs settings, Telepresence Connect and Quit, and gutter markers between a resource and the manifests that use it. Also: Create Helm Chart, Configure Helm Parameters (release, values file, --set for template and lint), Customize Namespaces, Select Log Sources (pick pods or containers), a Debug image prompt with recent images (Edit Recent Debug Images), and Go to Declaration between manifests (names of ConfigMaps, Secrets, Services, claims and service accounts). 0.2.0: right-click a resource in the tree for describe, YAML, logs, shell, attach, debug, port forward, show secret and delete (asks to confirm); needs OpenIDEA 1.2. 0.1.0: first release. Cluster tree; describe; YAML in an editor that applies on save, with the Kubernetes schema; logs (pods and workloads), shell, attach, port forward; delete; apply, dry run, diff and delete of the open manifest; Kustomize render and apply; Helm template, lint and dependency update."
categories = ["tools"]
icon = "icon.svg"
engines.openidea = "^1.2"
wasm = "dist/plugin.wasm"
activation = ["on-view:kube", "on-event:file-opened", "on-event:file-saved"]

[capabilities]
required = ["process:kubectl", "editor.read", "storage"]
# Reload from Cluster edits the open file (editor.write). Edit YAML in an editor (setting yamlInEditor, off by default): tee writes a temp file, saving it applies it.
# Helm commands run helm; finding the chart around the open file reads the project.
# events + project.read: manifest problems on open and save (silently off without them).
optional = ["process:tee", "events", "project.read", "editor.write", "process:helm", "process:telepresence", "clipboard"]


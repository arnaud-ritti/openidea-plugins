apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: $NAME$
spec:
  serviceName: $NAME$
  replicas: 1
  selector:
    matchLabels:
      app: $NAME$
  template:
    metadata:
      labels:
        app: $NAME$
    spec:
      containers:
        - name: $NAME$
          image: $END$
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

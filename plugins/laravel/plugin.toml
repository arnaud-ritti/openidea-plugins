[[contributes.mcpTools]]
name = "inventory"
description = "Search cached Laravel source inventories; configuration and environment values are omitted."
inputSchema = "mcp/inventory.schema.json"
readOnly = true
destructive = false

[[contributes.mcpTools]]
name = "artisan_commands"
description = "Read captured Artisan command definitions and a revision token without executing PHP."
inputSchema = "mcp/artisan_commands.schema.json"
readOnly = true
destructive = false

[[contributes.mcpTools]]
name = "runtime_snapshot"
description = "Read captured Laravel runtime metadata without bootstrapping PHP; raw log tails require explicit includeLogs=true."
inputSchema = "mcp/runtime_snapshot.schema.json"
readOnly = true
destructive = false

[[contributes.mcpTools]]
name = "runtime_refresh"
description = "Execute project PHP to refresh one bounded application, event, schedule, failed-job, queue-statistics or worker snapshot. Application bootstrap may have side effects."
inputSchema = "mcp/runtime_refresh.schema.json"
readOnly = false
destructive = true

[[contributes.mcpTools]]
name = "artisan_execute"
description = "Execute a captured Artisan command with exact validated arguments. May change project files or databases. Returns a job ID; poll artisan_job."
inputSchema = "mcp/artisan_execute.schema.json"
readOnly = false
destructive = true

[[contributes.mcpTools]]
name = "artisan_job"
description = "Poll the owned captured Artisan job and bounded output; does not start a process."
inputSchema = "mcp/artisan_job.schema.json"
readOnly = true
destructive = false

[[contributes.mcpTools]]
name = "artisan_cancel"
description = "Cancel the owned Artisan process. For Docker this stops the client; container PHP may continue."
inputSchema = "mcp/artisan_cancel.schema.json"
readOnly = false
destructive = false


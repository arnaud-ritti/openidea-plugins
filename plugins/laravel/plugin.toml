id = "aritti.laravel"
name = "Laravel"
version = "0.4.0" # x-release-please-version
description = """Laravel support in PHP and Blade files. Completion and go to definition for routes, views, config keys, translations, env keys, middleware, assets, controllers and controller actions, Blade and Livewire components, Vite entries, validation rules, gate abilities and Eloquent columns from migrations, and for the sections and stacks of the layouts a Blade view extends. Reports views, config keys and translation keys that don't exist, with a quick fix that adds a missing translation key. Gutter markers link controllers, routes, views and layouts. A Laravel tool window lists routes, views, config, translations, middleware and env keys, and commands run common artisan tasks. Blade files need the aritti.blade plugin for highlighting."""
authors = ["Arnaud Ritti <arnaud.ritti@gmail.com>"]
homepage = "https://github.com/arnaud-ritti/openidea-plugins/tree/main/plugins/laravel"
license = "MIT"
change-notes = """\
Next release: Fresh Migration and Seed Database confirm first, palette commands ask which route, model, failed job or log entry, commands show only in projects with an artisan file, model helper commands, Create Missing View and the Generators tab write after one confirmation, the hub groups its tabs into sections and a controller method's Laravel gutter icon lists all its routes in the IDE's target chooser, also in large projects; Database tab with models, columns, indexes, a Compare view, a Schema sub-tab and a Tables tree, and unreadable migrations are listed instead of breaking it; Send Request shows the response and handles large inputs; Choose Docker Target works again, accepts DDEV synced volumes and refreshes Artisan commands after a pick; a Routes tab in Search Everywhere, a status bar menu, coloured Run consoles, enum quick fix in where(), Windows PHP calls without a console window, faster indexing on large projects, plainer settings, command names, messages and permission messages, shortcuts for Search Routes and Search Names and database errors without SQL or credentials. \
0.3.0: broader Laravel navigation and the hub window. \
0.2.0: plugin icon and window consolidation."""
categories = ["frameworks"]
icon = "icon.svg"
engines.openidea = "^1.14"
wasm = "dist/plugin.wasm"
activation = ["on-language:php", "on-language:blade", "on-file:pint.json", "on-file:phpstan.neon", "on-file:phpstan.dist.neon", "on-file:resources/js/**", "on-schedule:60"]

[capabilities]
required = ["project.read", "events"]
# process:docker: explicit opt-in local container metadata inspection/discovery only. clipboard: Copy as curl, and the fallback of Create HTTP Request File. project.write: native factory/resource creation. Artisan commands run `php artisan`; editor.read: Create Missing Target reads the name under the cursor.
optional = ["project.write", "process:php", "process:php-win", "process:docker", "process:composer", "process:laravel", "fs.read:~", "database.sources", "secrets", "net:127.0.0.1", "net:localhost", "editor.read", "clipboard", "storage"]


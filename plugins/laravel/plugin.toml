id = "aritti.laravel"
name = "Laravel"
version = "0.1.0" # x-release-please-version
description = """Laravel support in PHP and Blade files. Completion and go to definition for routes, views, config keys, \
translations, env keys, middleware, assets, controllers and controller actions, Blade and Livewire components, Vite \
entries, validation rules, gate abilities and Eloquent columns from migrations, and for the sections and stacks of the layouts a Blade view extends. Reports views, config keys and translation keys that don't exist, with a quick fix \
that adds a missing translation key. Gutter markers link controllers, routes, views and layouts. A Laravel tool window \
lists routes, views, config, translations, middleware and env keys, and commands run common artisan tasks. \
Partial port of the Laravel Plugin for IntelliJ by Daniel Espendiller (MIT), plus features that follow Laravel's \
documentation. Blade files need the aritti.blade plugin for highlighting."""
authors = ["Arnaud Ritti <arnaud.ritti@gmail.com>", "Daniel Espendiller (original Laravel Plugin)"]
homepage = "https://github.com/Haehnchen/idea-php-laravel-plugin"
license = "MIT"
change-notes = """Unreleased: Laravel: the tool window has Routes and Index sections; Routes is a flat list with method icons, a controller filter, a flat/tree toggle, and Copy as curl and Create HTTP Request File row actions. Laravel: 20 more file templates (Channel, Console Command, Http Exception, PHPUnit tests, Resource Collection, Class, Model, Dusk, Nova, Livewire Form, Fractal, Volt, Inertia pages, four Blade files); one problem listing the missing Route::resource methods; Use #[Scope] on all scope methods; column completion through `$query = Model::query()` variables; route and controller gutter links from the document indexer; Remove IDE Helper PHPDoc from Models; Generate for Model from the Project view with factory and resource bodies filled from migration columns (optional process:tee); Nova, Filament and Livewire form generators; Create Missing for Job, Mail, Event and similar classes; settings modelDirectories and reportMissingResourceMethods. Laravel: Livewire method, route controller and method problems, Find Unused Views, model/factory/policy/observer/event gutter links from a document indexer, component attribute and slot completion, relation-aware column completion, container name completion (app(), @inject, config providers), scope/constructor/facade/translation/rules intentions and 11 more file templates. Laravel: Run Artisan Command..., Generate with artisan make..., New Eloquent Model..., Generate for Model... and Create Missing View, Component or Controller ask for names and options, then run php artisan make:* in a terminal. 0.1.0: first release. Ported from the Laravel Plugin (de.espend.idea.laravel) 0.15.4, \
source revision 3a07f4a5f67dc0aacbcd6fdb11a8b5c9814803b0 (tag 0.15.4): routes, controllers, views, config, translations, \
assets and the Blade layout markers. Env keys, middleware, route groups, JSON translations, components, Vite entries, \
validation rules, abilities, columns, problems, the tool window and artisan commands follow Laravel's documentation. This port works from a text index of the project, so the features that \
need PhpStorm's PSI are missing (container types, Eloquent, facades)."""
categories = ["frameworks"]
icon = "icon.svg"
engines.openidea = "^1.2"
wasm = "dist/plugin.wasm"
activation = ["on-language:php", "on-language:blade", "on-file:resources/js/**"]

[capabilities]
required = ["project.read", "events"]
# clipboard: Copy as curl, and the fallback of Create HTTP Request File. process:tee: bulk PHPDoc removal and factory/resource generators write files. Artisan commands run `php artisan`; editor.read: Create Missing Target reads the name under the cursor.
optional = ["process:php", "process:tee", "editor.read", "clipboard", "storage"]


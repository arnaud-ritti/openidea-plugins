[package]
name = "openidea-plugin-aritti-liquibase"
version = "0.1.0"
edition = "2024"
publish = false

# A plugin builds on its own (target wasm32-wasip2), outside any IDE workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sha2 = "0.10"
ui-kit = { path = "../../crates/ui-kit" }
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", tag = "v0.1.50" }
spring-text = { path = "../../crates/spring-text" }
serde_json = "1"
serde = "1"
quick-xml = "0.42"
yaml-rust2 = { version = "0.13", default-features = false }

[dev-dependencies]
regex = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"

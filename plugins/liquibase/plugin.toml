id = "aritti.liquibase"
name = "Liquibase Changelogs"
version = "0.1.0" # x-release-please-version
description = "Liquibase changelog support for XML, YAML and formatted SQL. Flags duplicate and incomplete changesets, unknown change types, missing includes and missing formatted SQL headers while you type; completes change types and their attributes in YAML and changeset comments in SQL; Go to Definition on include; New › Liquibase Changelog templates; status, validate, update-sql and update run configurations for projects with a liquibase.properties. Independent implementation, not affiliated with Liquibase Inc. or JetBrains."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = "Unreleased: gutter link on each include to its changelog file; Liquibase icon on db.changelog-* files. JSON changelogs (checks, changesets view, Go to Definition on include, project index). completion of include file paths (XML, YAML), changeSet author names (setting or git user.name) and, in XML changesets without a declared schema, change type elements and attributes. Project-wide Go to Declaration from the document index: include to the changelog file, rollback changeSetId to its changeSet, table names to createTable. Liquibase: Update (Asks First)… and Liquibase: Rollback Count… commands, with confirmation and a changeset count. 0.1.0: first release. Live checks (duplicate and incomplete changesets, unknown change types in YAML, unresolved include and includeAll, formatted SQL header), YAML and formatted SQL completion, Go to Definition on include, changelog templates and Liquibase CLI run configurations. Change type and attribute names from the Liquibase 4.29 XSD (Apache-2.0)."
categories = ["tools", "linters"]
engines.openidea = "^1.2"
wasm = "dist/plugin.wasm"
activation = ["on-language:xml", "on-language:yaml", "on-language:json", "on-language:sql", "on-view:changesets"]

[capabilities]
required = ["project.read"]
# process: Update and Rollback Count commands (a terminal); git: the author name offered in changesets.
optional = ["process:liquibase", "process:git"]

[[contributes.commands]]
id = "update-confirmed"
title = "Liquibase: Update (Asks First)…"
category = "Liquibase"

[[contributes.commands]]
id = "rollback-count"
title = "Liquibase: Rollback Count…"
category = "Liquibase"

[[contributes.providers]]
kinds = ["line-markers"]
languages = ["xml", "yaml", "json", "sql"]

[[contributes.providers]]
kinds = ["definition"]
languages = ["xml", "yaml", "json"]

[[contributes.providers]]
kinds = ["completion"]
languages = ["xml", "yaml", "sql"]

[[contributes.runDetectors]]
id = "status"
name = "Liquibase: status"
files = ["liquibase.properties"]
command = "liquibase"
args = ["status", "--verbose"]

[[contributes.runDetectors]]
id = "validate"
name = "Liquibase: validate"
files = ["liquibase.properties"]
command = "liquibase"
args = ["validate"]

[[contributes.runDetectors]]
id = "update-sql"
name = "Liquibase: update-sql (preview, no changes)"
files = ["liquibase.properties"]
command = "liquibase"
args = ["update-sql"]

[[contributes.runDetectors]]
id = "update"
name = "Liquibase: update (writes to the database)"
files = ["liquibase.properties"]
command = "liquibase"
args = ["update"]

[[contributes.documentIndexers]]
extensions = ["xml", "yaml", "yml", "json", "sql"]

[[contributes.views]]
id = "changesets"
title = "Liquibase Changesets"
icon = "icons/liquibase.svg"
location = "bottom"

[[contributes.fileTemplates]]
id = "changelog-xml"
name = "Liquibase Changelog (XML)"
extension = "xml"
path = "templates/changelog.xml"

[[contributes.fileTemplates]]
id = "changelog-yaml"
name = "Liquibase Changelog (YAML)"
extension = "yaml"
path = "templates/changelog.yaml"

[[contributes.fileTemplates]]
id = "changelog-sql"
name = "Liquibase Changelog (Formatted SQL)"
extension = "sql"
path = "templates/changelog.sql"

[[contributes.fileIcons]]
id = "changelog"
patterns = ["db.changelog-*", "db.changelog.*", "liquibase.properties"]
icon = "icons/liquibase.svg"

[contributes.settings]
title = "Liquibase Changelogs"
schema = "settings.schema.json"

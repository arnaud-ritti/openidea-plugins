id = "aritti.liquibase"
name = "Liquibase Changelogs"
version = "0.3.0" # x-release-please-version
description = "Liquibase changelog support for XML, YAML and formatted SQL. Versioned source checks flag local duplicate/incomplete changesets, unknown YAML change types and missing formatted SQL headers; cached source hover and include navigation are bounded; completes change types and their attributes in YAML and changeset comments in SQL; Go to Definition on include; New › Liquibase Changelog templates; status, validate, update-sql and update run configurations for projects with a liquibase.properties."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = "Unreleased: changelog include gutter markers use their own icon. Unreleased: structural changelog checks from the Liquibase XSD rules, offline: include/includeAll/sqlFile without path, sqlFile path existence (relative or classpath, quiet when ambiguous), invalid preConditions onFail/onError (root changelog accepts only HALT or WARN, changeSet HALT, CONTINUE, MARK_RAN or WARN, per the XSD), unknown XML precondition elements (uniqueConstraintExists now accepted), YAML preConditions not a list, formatted SQL non-boolean changeset attributes and --rollback before the first changeset. Unreleased: generated changeset groups, move/ignore/restore and operation-class selection; exact atomic multi-file XML group export. Unreleased: JSON key and formatted-SQL changeset attribute completion; expanded core change attributes; real OSS4.29.2 serializer fixtures and XML1.1-compatible generated source capture; command-specific offline URL/output environment binding with inherited-key collision rejection. Unreleased: native migration browser with source navigation, scoped Filter/Clear and reviewed Actions picker; no packaged web wrapper. Unreleased: Browser source selections reject ambiguous decoded JSON owners before adoption or replacement/deletion. XML namespace admission rejects duplicate expanded attribute names while retaining distinct namespace attributes. XML admission checks qualified names with Unicode XML1.0 NCName ranges before accepting source edits or generated candidates. Include navigation validates XML before scanner fallback and refuses opaque ownership while preserving legacy unnamespaced read-only support. XML mutation and generated-candidate admission validate declaration context/shape and reserved processing-instruction targets. XML source mutation rejects prefixed namespace undeclarations and malformed qualified/reserved bindings while preserving legal xml attributes and Liquibase prefixes. Offline diff cleanup preserves changed/unreadable staged input slots rather than truncating source it can no longer match; unchanged owned bytes still clear on finish/Stop. Versioned local diagnostics and cached source hover replace gutter diagnostic publishing. Unknown include/property absence stays quiet; unproved automatic table Rename anchors are withheld. Confirmed atomic editor FileActions add XML/formatted-SQL changesets, create standalone changelogs in four formats or create a child plus XML parent include as one workspace action. XML mutation validates well-formed Liquibase namespaces; paths, collisions, snapshots and identities are guarded. Removed tee/direct command writes; generator commands guide to editor intentions. gutter link on each include to its changelog file; Liquibase icon on db.changelog-* files. JSON changelogs (checks, changesets view, Go to Definition on include, project index). completion of include file paths (XML, YAML), changeSet author names (setting or git user.name) and, in XML changesets without a declared schema, change type elements and attributes. Project-wide Go to Declaration from the document index: include to the changelog file, rollback changeSetId to its changeSet, table names to createTable. Liquibase: Update (Asks First)… and Liquibase: Rollback Count… commands, with confirmation and a changeset count. 0.1.0: first release. Live checks (duplicate and incomplete changesets, unknown change types in YAML, unresolved include and includeAll, formatted SQL header), YAML and formatted SQL completion, Go to Definition on include, changelog templates and Liquibase CLI run configurations."
categories = ["tools", "linters"]
icon = "icon.svg"
engines.openidea = "^1.9"
wasm = "dist/plugin.wasm"
activation = ["on-language:xml", "on-language:yaml", "on-language:json", "on-language:sql", "on-view:changesets"]

[capabilities]
required = ["project.read"]
# process: reviewed offline diff and Update/Rollback commands; git: the author name offered in changesets.
optional = ["process:liquibase", "process:git", "storage", "events"]

[[contributes.commands]]
id = "choose-sources"
title = "Liquibase: Choose Browser Root and Configuration…"
category = "Liquibase"

[[contributes.commands]]
id = "clear-sources"
title = "Liquibase: Browse All Project Changelogs"
category = "Liquibase"

[[contributes.commands]]
id = "update-confirmed"
title = "Liquibase: Update (Asks First)…"
category = "Liquibase"

[[contributes.commands]]
id = "new-changeset"
title = "Liquibase: New Changeset"
category = "Liquibase"

[[contributes.commands]]
id = "new-changelog"
title = "Liquibase: New Changelog…"
category = "Liquibase"

[[contributes.commands]]
id = "rollback-count"
title = "Liquibase: Rollback Count…"
category = "Liquibase"

[[contributes.providers]]
kinds = ["code-actions"]
languages = ["xml", "yaml", "json", "sql"]

[[contributes.providers]]
kinds = ["line-markers"]
languages = ["xml", "yaml", "json", "sql"]

[[contributes.providers]]
kinds = ["definition"]
languages = ["xml", "yaml", "json", "sql"]

[[contributes.providers]]
kinds = ["completion"]
languages = ["xml", "yaml", "sql"]

# Database-writing operations remain freshly reviewed commands; never native Rerun.
[[contributes.runConfigurations]]
files = ["liquibase.properties"]

[[contributes.documentIndexers]]
extensions = ["xml", "yaml", "yml", "json", "sql"]

[[contributes.views]]
id = "changesets"
title = "Liquibase"
icon = "icons/liquibase.svg"
location = "bottom"
web = "web/resources/hub.html"

[[contributes.fileTemplates]]
id = "changelog-xml"
name = "Liquibase Changelog (XML)"
extension = "xml"
path = "templates/changelog.xml"

[[contributes.fileTemplates]]
id = "changelog-yaml"
name = "Liquibase Changelog (YAML)"
extension = "yaml"
path = "templates/changelog.yaml"

[[contributes.fileTemplates]]
id = "changelog-sql"
name = "Liquibase Changelog (Formatted SQL)"
extension = "sql"
path = "templates/changelog.sql"

[[contributes.fileIcons]]
id = "changelog"
patterns = ["db.changelog-*", "db.changelog.*", "liquibase.properties"]
icon = "icons/liquibase.svg"

[contributes.settings]
title = "Liquibase Changelogs"
schema = "settings.schema.json"

[[contributes.providers]]
kinds = ["diagnostics", "hover"]
languages = ["xml", "yaml", "json", "sql"]

[[contributes.commands]]
id = "offline-diff"
title = "Liquibase: Review Offline Snapshot Diff"
category = "Liquibase"

[[contributes.commands]]
id = "offline-diff-run"
title = "Liquibase: Run Reviewed Offline Snapshot Diff…"
category = "Liquibase"

[[contributes.markerIcons]]
id = "include"
icon = "icons/marker-include.svg"

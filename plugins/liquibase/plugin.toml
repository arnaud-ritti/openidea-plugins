id = "aritti.liquibase"
name = "Liquibase Changelogs"
version = "0.4.0" # x-release-please-version
description = "Liquibase changelog support for XML, YAML, JSON and formatted SQL: flags duplicate or incomplete changesets, unknown YAML change types and missing SQL headers; hover and include navigation; completes change types and their attributes; Go to Definition on include; New › Liquibase Changelog templates; a changeset browser with pending status; status, validate and update-sql run configurations for projects with a liquibase.properties."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = """\
Next release: A Search Everywhere tab finds changesets, Run consoles colour Liquibase output, Update Database… and Rollback Count… confirmations name the database and host (also SQL Server, Oracle, Db2, H2 and SQLite) and ask you to type the command when it cannot be read, and Show Pending Changesets marks changesets in the browser and notes changelog files. New Changeset and New Changelog create the entry on the open changelog, and New Changelog… without an open changelog creates one at a path you choose; changelog include markers have their own icon and list every changelog of an includeAll directory, Go to Definition offers each matching include file, and missing include, includeAll and sqlFile targets are flagged in the editor; undeclared ${property} placeholders are flagged, with a setting to turn this off; offline structure checks for XML changelogs, faster on large changelogs and for a changelog open before the plugin starts, and completion for JSON keys and SQL attributes; one name per action, a shorter offline diff toolbar, plainer messages, and hover shows facts only. \
0.3.0: migration browser and generated changeset groups. \
0.2.0: plugin icon and audit improvements."""
categories = ["tools", "linters"]
icon = "icon.svg"
engines.openidea = "^1.14"
wasm = "dist/plugin.wasm"
activation = ["on-language:xml", "on-language:yaml", "on-language:json", "on-language:sql", "on-view:changesets"]

[capabilities]
required = ["project.read"]
# process: reviewed offline diff, Update/Rollback and Show Pending Changesets (status) commands; git: the author name offered in changesets.
# editor.*, project.write: New Changeset edits the open changelog; New Changelog… creates the file (and the parent include).
optional = ["process:liquibase", "process:git", "storage", "events", "editor.read", "editor.write", "project.write"]


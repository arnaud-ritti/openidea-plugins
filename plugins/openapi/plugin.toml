id = "aritti.openapi"
name = "OpenAPI"
version = "0.4.0" # x-release-please-version
description = "Editing support for OpenAPI 3 and Swagger 2 files in YAML and JSON: $ref completion and navigation, problems for unresolved references, duplicate operationIds and path parameters, the official schema for validation, an endpoints tool window, a Swagger UI preview beside the text, and requests for the HTTP client."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = """\
Next release: An OpenAPI Operations tab in Search Everywhere finds operations by method, path, tag or ID, and an Operations panel beside spec editors lists them by tag with a filter, highlights the one at the caret and marks problems; Copy as cURL and Create HTTP Request File suggest the spec server and work from Search Everywhere, and the preview remembers Redoc or Swagger UI; Try it out works with YAML specs, starts from the preview Try button or a Try action on the left edge of GET and HEAD lines, accepts a single https server with the optional net:ask permission and refuses private, single-label and localhost servers; Draft Spec from Source Mappings and Breaking-Change Report commands, operation and response quick fixes in JSON, and self-contained export stops duplicating components; gutter markers skip non-spec files, list an operation's $refs in a chooser and mark component declarations with their $ref uses, files in hidden folders are ignored, setting titles are shorter, spec commands are enabled only in a spec, and code generation says when it is done and how to apply it. \
0.3.0: generation with preview and apply, richer checks. \
0.2.0: plugin icon and audit improvements."""
categories = ["languages", "tools"]
icon = "icon.svg"
engines.openidea = "^1.14"
wasm = "dist/plugin.wasm"

activation = ["on-event:file-opened", "on-event:file-saved", "on-view:endpoints"]

[capabilities]
required = ["project.read", "editor.read", "events"]
optional = ["project.write", "clipboard", "process:git", "storage", "net:127.0.0.1", "net:ask", "process:swagger-codegen"]

[[contributes.markerIcons]]
id = "ref"
icon = "icons/marker-ref.svg"

[[contributes.markerIcons]]
id = "referenced-by"
icon = "icons/openapiinitiative.svg"

[[contributes.providers]]
kinds = ["completion", "definition", "code-actions", "line-markers"]
languages = ["yaml", "json"]

[[contributes.providers]]
kinds = ["diagnostics"]
languages = ["json"]

[[contributes.providers]]
kinds = ["hover"]
languages = ["json", "yaml"]

# "Try GET /pets…" at the left edge of operation lines that Try it out can send.
[[contributes.providers]]
kinds = ["hover-actions"]
languages = ["json", "yaml"]

[[contributes.searchCategories]]
id = "operations"
title = "OpenAPI Operations"

# Beside the editor of a spec: the active editor's spec status comes from host::set_context.
[[contributes.editorPanels]]
id = "operations"
web = "web/operations.html"
width = 260
when = "(editorLangId == yaml || editorLangId == json) && plugin.aritti.openapi.spec"

[[contributes.views]]
id = "endpoints"
title = "OpenAPI Endpoints"
icon = "web"
location = "right"
web = "web/resources/hub.html"

[[contributes.commands]]
id = "compare-specs"
title = "OpenAPI: Compare With Another Spec…"
category = "OpenAPI"

[[contributes.commands]]
id = "compare-specs-breaking"
title = "OpenAPI: Breaking-Change Report Against Another Spec…"
category = "OpenAPI"

[[contributes.commands]]
id = "draft-from-source"
title = "OpenAPI: Draft Spec from Source Mappings…"
category = "OpenAPI"

[[contributes.commands]]
id = "compare-last-revision"
title = "OpenAPI: Compare With Last Revision"
category = "OpenAPI"

[[contributes.commands]]
id = "export-self-contained"
title = "OpenAPI: Write Self-Contained Spec"
category = "OpenAPI"
when = "plugin.aritti.openapi.spec"

[[contributes.commands]]
id = "copy-reference"
title = "OpenAPI: Copy Reference to the Key at the Caret"
category = "OpenAPI"
when = "plugin.aritti.openapi.spec"

[[contributes.commands]]
id = "copy-http-requests"
title = "OpenAPI: Write Requests for the HTTP Client"
category = "OpenAPI"
when = "plugin.aritti.openapi.spec"

[[contributes.commands]]
id = "copy-route-curl"
title = "OpenAPI: Copy as cURL"
category = "OpenAPI"

[[contributes.commands]]
id = "create-route-http"
title = "OpenAPI: Create HTTP Request File"
category = "OpenAPI"



[[contributes.fileIcons]]
id = "route-get"
patterns = ["*.openapi-route-get"]
icon = "icons/route-get.svg"

[[contributes.fileIcons]]
id = "route-post"
patterns = ["*.openapi-route-post"]
icon = "icons/route-post.svg"

[[contributes.fileIcons]]
id = "route-put"
patterns = ["*.openapi-route-put"]
icon = "icons/route-put.svg"

[[contributes.fileIcons]]
id = "route-delete"
patterns = ["*.openapi-route-delete"]
icon = "icons/route-delete.svg"

[[contributes.fileIcons]]
id = "route-patch"
patterns = ["*.openapi-route-patch"]
icon = "icons/route-patch.svg"

[[contributes.fileIcons]]
id = "route-other"
patterns = ["*.openapi-route-other"]
icon = "icons/route-other.svg"

[[contributes.customEditors]]
id = "preview"
title = "API Preview"
patterns = ["openapi.{yaml,yml,json}", "swagger.{yaml,yml,json}", "*.openapi.{yaml,yml,json}", "*.swagger.{yaml,yml,json}"]
priority = "default"
layout = "split"
web = "web/index.html"

[[contributes.customEditors]]
id = "preview-any"
title = "API Preview"
patterns = ["*.yaml", "*.yml", "*.json"]
priority = "option"
web = "web/index.html"

[[contributes.fileIcons]]
id = "openapi"
patterns = ["openapi.yaml", "openapi.yml", "openapi.json", "swagger.yaml", "swagger.yml", "swagger.json", "*.openapi.yaml", "*.openapi.yml", "*.openapi.json", "*.swagger.yaml", "*.swagger.yml", "*.swagger.json"]
icon = "icons/openapiinitiative.svg"

[[contributes.fileTemplates]]
id = "openapi-yaml"
name = "OpenAPI 3.1 (YAML)"
extension = "yaml"
path = "templates/openapi.yaml"

[[contributes.fileTemplates]]
id = "openapi-json"
name = "OpenAPI 3.1 (JSON)"
extension = "json"
path = "templates/openapi.json"

[[contributes.fileTemplates]]
id = "swagger-yaml"
name = "Swagger 2.0 (YAML)"
extension = "yaml"
path = "templates/swagger.yaml"

[[contributes.fileTemplates]]
id = "swagger-json"
name = "Swagger 2.0 (JSON)"
extension = "json"
path = "templates/swagger.json"

[[contributes.fileTemplates]]
id = "asyncapi-yaml"
name = "AsyncAPI 3.0 (YAML)"
extension = "yaml"
path = "templates/asyncapi.yaml"

[contributes.settings]
title = "OpenAPI"
schema = "settings.schema.json"

[[contributes.endpoints]]
files = ["**/*.yaml", "**/*.yml", "**/*.json"]

[[contributes.commands]]
id = "try-local-read"
title = "OpenAPI: Try Local GET/HEAD Request…"
category = "OpenAPI"

[[contributes.commands]]
id = "component-occurrences"
title = "OpenAPI: Find Component Occurrences in This Document"
category = "OpenAPI"
when = "plugin.aritti.openapi.spec"

[[contributes.commands]]
id = "generate-code"
title = "OpenAPI: Generate Client, Server or Documentation…"
category = "OpenAPI"
when = "plugin.aritti.openapi.spec"

[[contributes.commands]]
id = "export-comparison"
title = "OpenAPI: Export Comparison as Markdown"
category = "OpenAPI"

[[contributes.commands]]
id = "component-project-usages"
title = "OpenAPI: Find Component Usages in Project"
category = "OpenAPI"
when = "plugin.aritti.openapi.spec"

[[contributes.commands]]
id = "generate-code-configured"
title = "OpenAPI: Generate With Options or Templates…"
category = "OpenAPI"
when = "plugin.aritti.openapi.spec"

[[contributes.commands]]
id = "forget-codegen-stage"
title = "OpenAPI: Stop Tracking Generated Code"
category = "OpenAPI"

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>API Preview</title>
    <link rel="stylesheet" href="./vendor/swagger-ui.css" />
    <style>
      body { margin: 0; background: #fff; }
      /* ponytail: Swagger UI has no dark theme; inverted colours until a real one is worth the CSS. */
      :root[data-theme="dark"] body { filter: invert(0.9) hue-rotate(180deg); }
      #reload, #switch { position: fixed; top: 8px; z-index: 10; }
      #reload { right: 16px; }
      #switch { right: 80px; }
      #redoc { display: none; }
    </style>
  </head>
  <body>
    <button id="reload" type="button">Reload</button>
    <button id="switch" type="button">Redoc</button>
    <div id="swagger"></div>
    <div id="redoc"></div>
    <script src="./vendor/swagger-ui-bundle.js"></script>
    <script src="./main.js"></script>
  </body>
</html>

[package]
name = "openidea-plugin-aritti-quarkus"
version = "0.1.0"
edition = "2024"
publish = false

# A plugin builds on its own (target wasm32-wasip2), outside any IDE workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ui-kit = { path = "../../crates/ui-kit" }
quick-xml = "0.42"
toml_edit = "0.25"
serde_json = "1"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
crc32fast = "1"
sha2 = "0.10"
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", tag = "v0.1.50" }
spring-text = { path = "../../crates/spring-text" }

[dev-dependencies]
regex = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"

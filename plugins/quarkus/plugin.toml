id = "aritti.quarkus"
name = "Quarkus Tools"
version = "0.4.0" # x-release-please-version
description = "Quarkus support for application.properties, application.yaml and microprofile-config.properties: completion of keys and values from the Quarkus 3.40 configuration metadata, MicroProfile Config and the project's @ConfigProperty and @ConfigMapping declarations, %dev/%test/%prod profiles, warnings for deprecated and unknown keys, Quarkus Dev Mode run configurations (mvn, gradle, quarkus CLI) and a shortcut to code.quarkus.io."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = """\
Next release: Run and Debug consoles colour Quarkus ERROR and WARN log lines, Caused by lines and the startup line. Checks for JAX-RS resources and @Scheduled values, and JAX-RS lenses show the full path; Qute template support in Java, and gutter icons link config keys with the @ConfigProperty and @ConfigMapping code using them, listing every match; the plugin wakes only for projects that declare Quarkus; edits to a gitignored .env made outside the IDE are picked up when you open or save it, and tracked .env files are watched; row commands say what to select, permission and JAR metadata messages are clearer (including how to allow ~/.m2/repository), setting titles are shorter and the starter command is Create Maven/Qute Starter, defaults to Quarkus 3.40.1, confirms once and creates the files itself with the optional project.write permission (⌥⏎ otherwise), never overwriting, and Open Starter is offered afterwards, Show Endpoint or Schedule Details lists the current file's lenses from Search Everywhere, and Load Config Keys from a Dependency JAR replaces the old title. \
0.3.0: wider configuration support and a consolidated window. \
0.2.0: plugin icon and audit improvements."""
categories = ["frameworks"]
icon = "icon.svg"
engines.openidea = "^1.14"
wasm = "dist/plugin.wasm"
activation = [
    "on-file:**/application*.properties",
    "on-file:**/application*.yaml",
    "on-file:**/application*.yml",
    "on-file:**/microprofile-config.properties",
    "on-language:java",
    "on-language:qute-html",
    "on-language:quarkus-properties",
    "on-file:**/pom.xml",
    "on-file:**/src/main/resources/templates/**",
]

[capabilities]
required = ["project.read"]
optional = ["events", "fs.read:~/.m2/repository", "editor.read", "project.write"]

[[contributes.providers]]
kinds = ["completion", "line-markers"]
languages = ["properties", "quarkus-properties", "yaml"]

[[contributes.providers]]
kinds = ["completion", "code-actions", "line-markers"]
languages = ["java"]

[[contributes.markerIcons]]
id = "config"
icon = "icons/quarkus.svg"
iconDark = "icons/quarkus_dark.svg"

[[contributes.providers]]
kinds = ["diagnostics", "hover", "definition"]
languages = ["java", "properties", "quarkus-properties", "yaml"]

[[contributes.providers]]
kinds = ["inlay-hints"]
languages = ["properties", "quarkus-properties", "yaml"]

[[contributes.providers]]
kinds = ["code-actions"]
languages = ["xml"]

[[contributes.providers]]
kinds = ["definition", "completion", "diagnostics", "folding"]
languages = ["html", "plaintext", "qute-html"]

[[contributes.documentIndexers]]
extensions = ["properties", "yaml", "yml", "java"]

[[contributes.commands]]
id = "open-code-quarkus"
title = "Quarkus: Open code.quarkus.io"
category = "Quarkus"

# Build-file markers: a detector can't look inside pom.xml, and ./mvnw can't be a process: program.
[[contributes.runDetectors]]
id = "dev-maven"
name = "Quarkus Dev Mode (mvn)"
files = ["pom.xml"]
command = "mvn"
args = ["quarkus:dev"]

[[contributes.runDetectors]]
id = "dev-gradle"
name = "Quarkus Dev Mode (gradle)"
files = ["build.gradle", "build.gradle.kts"]
command = "gradle"
args = ["quarkusDev"]

[[contributes.runDetectors]]
id = "dev-cli"
name = "Quarkus Dev Mode (quarkus CLI)"
files = ["pom.xml", "build.gradle", "build.gradle.kts"]
command = "quarkus"
args = ["dev"]

[contributes.settings]
schema = "settings.schema.json"
title = "Quarkus Tools"

[[contributes.commands]]
id = "read-dependency-jar-metadata"
title = "Quarkus: Load Config Keys from a Dependency JAR…"
category = "Quarkus"

[[contributes.commands]]
id = "prepare-local-starter"
title = "Quarkus: Create Maven/Qute Starter…"
category = "Quarkus"
when = "editorLangId == java || editorLangId == xml"

[[contributes.commands]]
id = "open-reviewed-starter"
title = "Quarkus: Open Starter…"
category = "Quarkus"
when = "plugin.aritti.quarkus.starterCreated"

[[contributes.providers]]
kinds = ["code-lenses", "document-symbols", "inlay-hints"]
languages = ["java"]

[[contributes.commands]]
id = "inspect-source-declaration"
title = "Quarkus: Show Endpoint or Schedule Details…"
category = "Quarkus"
when = "editorLangId == java"

[[contributes.languages]]
path = "languages/qute-html.toml"

[[contributes.languages]]
path = "languages/quarkus-properties.toml"

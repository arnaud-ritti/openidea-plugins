id = "aritti.quarkus"
name = "Quarkus Tools"
version = "0.1.0"
description = "Quarkus support for application.properties, application.yaml and microprofile-config.properties: completion of keys and values from the Quarkus 3.40 configuration metadata, MicroProfile Config and the project's @ConfigProperty and @ConfigMapping declarations, %dev/%test/%prod profiles, warnings for deprecated and unknown keys, Quarkus Dev Mode run configurations (mvn, gradle, quarkus CLI) and a shortcut to code.quarkus.io. Ported from Red Hat's Quarkus Tools for IntelliJ (com.redhat.devtools.intellij.quarkus), EPL-2.0."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>", "Red Hat, Inc. (original Quarkus Tools for IntelliJ)"]
license = "EPL-2.0"
change-notes = "0.1.0: first release, with key and value completion, profiles, project keys from @ConfigProperty and @ConfigMapping, deprecated and unknown key warnings, Quarkus Dev Mode run detectors and the Open code.quarkus.io command. Ported from com.redhat.devtools.intellij.quarkus 2.6.1 (source: redhat-developer/intellij-quarkus tag 2.6.1, be058542ce55eda5a72d3b35a205d3027e8a906f). Bundled configuration metadata from Quarkus 3.40.1 (Apache-2.0)."
categories = ["frameworks"]
engines.openidea = "^1.0"
wasm = "dist/plugin.wasm"
activation = [
    "on-file:**/application*.properties",
    "on-file:**/application*.yaml",
    "on-file:**/application*.yml",
    "on-file:**/microprofile-config.properties",
]

[capabilities]
required = ["project.read"]

[[contributes.providers]]
kinds = ["completion", "line-markers"]
languages = ["properties", "yaml"]

[[contributes.providers]]
kinds = ["line-markers"]
languages = ["java"]

[[contributes.commands]]
id = "open-code-quarkus"
title = "Quarkus: Open code.quarkus.io"
category = "Quarkus"

# Build-file markers: a detector can't look inside pom.xml, and ./mvnw can't be a process: program.
[[contributes.runDetectors]]
id = "dev-maven"
name = "Quarkus Dev Mode (mvn)"
files = ["pom.xml"]
command = "mvn"
args = ["quarkus:dev"]

[[contributes.runDetectors]]
id = "dev-gradle"
name = "Quarkus Dev Mode (gradle)"
files = ["build.gradle", "build.gradle.kts"]
command = "gradle"
args = ["quarkusDev"]

[[contributes.runDetectors]]
id = "dev-cli"
name = "Quarkus Dev Mode (quarkus CLI)"
files = ["pom.xml", "build.gradle", "build.gradle.kts"]
command = "quarkus"
args = ["dev"]

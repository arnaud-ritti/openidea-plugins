id = "aritti.spring-beans"
name = "Spring Beans Navigator"
version = "0.1.0" # x-release-please-version
description = "Spring Framework beans for Java, Kotlin and XML configuration: finds stereotype classes, @Bean methods, Spring Data repositories and <bean> definitions; links injection points to the beans Spring would pick (by type through the project's type hierarchy, @Qualifier, @Primary, parameter name) and beans to where they are injected; navigates and completes bean names in qualifiers, XML references, SpEL @bean references and named pointcuts; completes SpEL #variables and pointcut designators; lists beans in a Spring Beans tool window, draws their dependencies in a Spring Bean Graph, and turns field injection into constructor injection. Independent implementation, not affiliated with JetBrains or Broadcom."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = "Unreleased: the Spring Beans, Spring Bean Graph and Spring Configuration Report windows are one Spring Beans window with Beans, Graph and Report sections, live templates (completion by abbreviation) and beans XML file templates, scope, profile and constructor-arg name completion, @MockitoBean names, relative resource paths and the default @ContextConfiguration file, factory-method visibility and lookup-method checks, imports that are not beans files, unresolved class attributes and filter expressions, @CacheConfig misuse, Kotlin publisher/listener and @ComponentScan/@Bean override markers, Move Annotation String to Property writes the line into the properties file (optional process:tee, clipboard fallback). Check Spring Configuration and Dump Spring Configuration commands (results in a Spring Configuration Report view), Move Annotation String to Property command, file templates for components, services, configurations, Boot applications and tests, and configuration properties (Java and Kotlin); inspections for unproxied @Bean calls, @Cacheable SpEL syntax and attribute conflicts, @Bean initMethod/destroyMethod, @TestBean and @Required targets, same-class overloads in self-invocation, unresolved @Lookup/@Scheduled/@MockitoSpyBean names and missing @ImportResource/@PropertySource/@ContextConfiguration/@Sql files (opt in), XML component-scan filters, missing imports, unresolved ref/parent/depends-on and placeholders (opt in), inactive profile blocks, and checks of bean classes (abstract, factory-method, constructor-arg count, init/destroy, @Required); setter completion and navigation for <property name>; document-index links for profiles, resource files, packages and @Value placeholders; META-INF/spring.handlers and spring.schemas checks; Kotlin redundant open, router pathVariable and reified extension hints. Also: Generate Setter, Constructor, Autowired Dependency and Event Listener editor commands; Change Active Spring Profiles (narrows the duplicate bean name check); gutter markers between event publishers and listeners and between classes and their XML beans, with a chooser for several targets, following the project's type hierarchy across files. Also: project-wide Go to Declaration and gutter markers from the host's document index (bean names, aliases, qualifiers, injection points by type), without the provider time budget. 0.2.0: Kotlin and XML bean configuration; bean names, aliases, @Qualifier, @Primary and @Profile; candidates through the whole type hierarchy; gutter icons from beans to their injection points; SpEL and AspectJ pointcut completion and navigation; Spring Bean Graph; Use constructor injection quick fix. 0.1.0 (first release): bean index, injection navigation, Spring Beans tool window, field injection warning."
categories = ["frameworks"]
icon = "icon.svg"
engines.openidea = "^1.2"
wasm = "dist/plugin.wasm"
activation = ["on-language:java", "on-language:kotlin", "on-language:xml", "on-event:file-opened", "on-event:file-saved"]


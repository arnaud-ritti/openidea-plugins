id = "aritti.spring-beans"
name = "Spring Beans Navigator"
version = "0.4.0" # x-release-please-version
description = "Spring Framework beans for Java, Kotlin and XML configuration: finds stereotype classes, @Bean methods, Spring Data repositories and <bean> definitions; links injection points to the beans Spring would pick (by type through the project's type hierarchy, @Qualifier, @Primary, parameter name) and beans to where they are injected; navigates and completes bean names in qualifiers, XML references, SpEL @bean references and named pointcuts; completes SpEL #variables and pointcut designators; lists beans and their dependencies in a Spring Beans tool window, and turns field injection into constructor injection."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = """\
Next release: A Spring Beans tab in Search Everywhere finds beans by name, kind or type and opens their declaration. The Spring Beans window docks on the right, appears only in Maven or Gradle projects, and Find Bean or Focus in Graph shows one bean with its dependencies and dependents; Beans, Graph and Report share one window, Check Spring Configuration runs in the background, beans switched off by @ConditionalOnProperty, @Profile or @ConditionalOnMissingBean show as inactive, and @NoRepositoryBean interfaces are not beans; SpEL completion and checks in injections, and bean navigation, markers and completion cover the whole project, and a gutter icon with several targets opens a target list; Create Bean from an XML reference, the Generate commands and XML bean intentions work on files of any size; shorter setting titles, clearer permission messages, one Refresh scans the whole project, and Report results can be run again. \
0.3.0: one Spring Beans window with live templates and more completion. \
0.2.0: plugin icon and bean checks."""
categories = ["frameworks"]
icon = "icon.svg"
engines.openidea = "^1.14"
wasm = "dist/plugin.wasm"
activation = ["on-language:spel", "on-language:java", "on-language:kotlin", "on-language:xml", "on-event:file-opened", "on-event:file-saved"]

[capabilities]
required = ["project.read", "editor.read"]
optional = ["events", "editor.write", "storage", "project.write"]

[[contributes.providers]]
kinds = ["definition", "line-markers", "completion", "code-actions", "diagnostics", "injections"]
languages = ["java", "kotlin", "xml"]


id = "aritti.spring-boot"
name = "Spring Boot Tools"
version = "0.3.0" # x-release-please-version
description = "Completion and checks for Spring Boot configuration files. Completes keys and values in application*.properties and application*.yml from a bundled Spring Boot fallback snapshot, explicitly selected version-qualified dependency JAR metadata, the project's configuration metadata files and its @ConfigurationProperties classes. Warns about deprecated keys (with a quick fix) and unknown keys in known groups, and checks cron expressions in @Scheduled(cron) and *.cron keys."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = "Unreleased: the Maven dependency JAR metadata command now resolves dependencies declared without a version when the root pom.xml's spring-boot-starter-parent or imported spring-boot-dependencies BOM (version literal or a ${property} defined in the same pom) manages them, reading the cached BOM POMs under ~/.m2/repository; ranges, SNAPSHOT versions and unresolved placeholders are refused, parent chains deeper than 4 and more than 8 imported BOMs are refused, and in-project parent POMs are not followed. Unreleased: the dependency JAR metadata confirmation names Gradle or Maven and its build file to match the selected source. Unreleased: the reviewed dependency JAR metadata command also reads build.gradle(.kts) literal group:artifact[:version] coordinates (explicit or Boot plugin/platform-BOM-managed versions; ranges, dynamic versions, classifiers and interpolation refused) from the optional read-only Gradle module cache (~/.gradle/caches/modules-2/files-2.1/<group>/<artifact>/<version>/<sha1>/); silently off when the grant is denied. Unreleased: reviewed Run with Profiles/Arguments command prompts per launch for validated profiles (offering application-<profile> files) and allowlisted --key=value arguments, shows the exact Maven (-Dspring-boot.run.profiles/arguments) or Gradle (bootRun --args) command, and opens it in a terminal only after confirmation; the profile pick list also offers literal profiles named by spring.profiles.include, spring.profiles.group and spring.config.activate.on-profile (plain names or a | b only) or declared in imported files. Unreleased: configuration-file recognition follows literal spring.config.import chains (import-relative locations resolve against the importing file; fixed file:/classpath: ones by path tail; optional: handled, configtree:, placeholders and wildcards refused; depth <= 8, files <= 64, cycle-safe) and <name>-<profile> variants of imported files for literal profiles, so their keys feed unknown-key, definition and usage checks; transitive hops through non-standard files are followed by command-time discovery only. Unreleased: opt-in native run profiles now also list Maven modules and Gradle subprojects declared by literal root modules/include entries whose own build file applies the Boot plugin; custom project dirs, profile modules and non-literal includes are withheld. Unreleased: opt-in native Maven/Gradle Boot run profiles for explicitly applied source build plugins; native process grants required, no automatic execution/wrapper/debugger integration. Unreleased: reviewed atomic exact static-source property Rename spans owned profile/properties/YAML and literal Java/Kotlin Value references, follows local imports/property sources, guards actual binding ownership and source completeness, previews every physical spelling change and revalidates before returning edits. Unreleased: reviewed native owned Database source setup from static current properties/YAML with secure credentials; no connect, introspection or SQL. Unreleased: project-scoped read-only property source occurrences preserve per-file/profile provenance and current editor text, bound discovery, exclude nested registered projects and revalidate target source before navigation; effective runtime binding remains unresolved; reviewed exact static-source Rename is separate. Unreleased: reviewed version-aware root-POM metadata selection resolves direct version properties and bounded approved official Boot parent/Cloud BOM catalogs from granted Maven-cache POMs; multiple dependency JAR snapshots coexist with hashes and version provenance. Selected Spring versions suppress authoritative bundled3.5 fallback and incomplete-catalog unknown-key negatives. No editor fetch/build execution. a Show Configuration Problems command that lists the project's configuration and metadata problems, class, enum and classpath resource completion in values, enum, class and list value checks, configuration files pointed at by spring.config.import, location and name, navigation from classpath resource values, constructor-binding checks for @ConfigurationProperties, deeper metadata file checks (defaults, deprecation, unresolved classes, hint names), plus the previously unlisted checks for early @EventListener events, @ConfigurationProperties prefixes, @SpringBootApplication in the default package, redundant @EnableAutoConfiguration/@ComponentScan, @DirtiesContext modes and transaction callbacks. Also: warns about property values that cannot convert to the key's type, navigation from spring.config.import and class-valued keys, completion of logger packages, profiles and ${} keys, checks and a define-key fix for additional-spring-configuration-metadata.json, a Reactor debug agent hint, an opt-in JDBC driver check and Spring Boot file templates. 0.1.0: 0.1.0: first release, with key and value completion, warnings for deprecated and unknown keys, a quick fix for deprecated keys and cron validation. Bundled metadata from Spring Boot 3.5.16."
categories = ["frameworks"]
icon = "icon.svg"
engines.openidea = "^1.9"
wasm = "dist/plugin.wasm"
activation = [
    "on-file:**/application*.properties",
    "on-file:**/application*.yml",
    "on-file:**/application*.yaml",
    "on-file:**/bootstrap*.properties",
    "on-file:**/bootstrap*.yml",
    "on-file:**/bootstrap*.yaml",
    "on-file:**/*spring-configuration-metadata.json",
    "on-language:java",
    "on-language:kotlin",
    "on-event:files-changed",
]

[capabilities]
required = ["project.read"]
optional = ["events", "fs.read:~/.m2/repository", "fs.read:~/.gradle/caches/modules-2/files-2.1", "editor.read", "database.sources", "process:mvn", "process:gradle"]

[[contributes.commands]]
id = "show-diagnostics"
title = "Spring Boot: Show Configuration Problems"
category = "Spring Boot"

[[contributes.providers]]
kinds = ["completion", "definition", "code-actions", "line-markers"]
languages = ["properties", "yaml"]

[[contributes.providers]]
kinds = ["line-markers"]
languages = ["json"]

[[contributes.providers]]
kinds = ["code-actions", "line-markers"]
languages = ["java"]

[[contributes.providers]]
kinds = ["diagnostics"]
languages = ["java", "json", "properties", "yaml"]

[[contributes.providers]]
kinds = ["hover", "inlay-hints"]
languages = ["properties", "yaml"]

[[contributes.runConfigurations]]
files = ["pom.xml", "build.gradle", "build.gradle.kts"]

[contributes.settings]
title = "Spring Boot"

[[contributes.settings.pages]]
id = "java"
title = "Java Source Checks"
schema = "settings-java.schema.json"

[[contributes.settings.pages]]
id = "configuration"
title = "Configuration and Metadata"
schema = "settings-configuration.schema.json"

[[contributes.settings.pages.actions]]
title = "Read static metadata from a selected Maven dependency JAR…"
command = "read-dependency-jar-metadata"

[[contributes.fileIcons]]
id = "spring-boot-config"
patterns = ["application*.properties", "application*.yml", "application*.yaml", "bootstrap*.properties", "bootstrap*.yml", "bootstrap*.yaml"]
icon = "icons/config.svg"
iconDark = "icons/config_dark.svg"


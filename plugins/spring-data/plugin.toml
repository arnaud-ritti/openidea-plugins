id = "aritti.spring-data"
name = "Spring Data Tools"
version = "0.3.1" # x-release-please-version
description = "Spring Data repositories in Java and Kotlin: checks derived query method names (findByAddressZipCodeOrderByAgeDesc…) against the domain class and the method's parameter count, completes them with the entity's properties and operator keywords, links repositories to their entity and custom implementation, opens the entity field from a method name with Go to Definition, checks @Query named parameters and @Modifying without @Query, and completes and checks entity names and alias properties in JPQL queries."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = """\
Next release: The command title now starts with Spring Data, like the rest of the Spring family. New icons for domain types, custom implementations and derived queries; projections, record DTOs and @EntityGraph paths are checked against the entity, and methods taking Class, Pageable or Sort through a wildcard import are checked again; derived-query and entity checks stay on after the project is idle or a file is deleted, and a duplicated class silences checks only for that class; create a repository or projection from an entity, and hover on repositories and queries; short setting titles, clearer permission messages, and inherited repository members listed in a picker instead of one long notification, and large projects no longer stop the plugin while it reads them. \
0.3.0: derived query checks and repository creation. \
0.2.0: plugin icon and repository navigation."""
categories = ["frameworks"]
icon = "icon.svg"
engines.openidea = "^1.14"
wasm = "dist/plugin.wasm"
activation = ["on-language:java", "on-language:kotlin", "on-event:files-changed"]

[capabilities]
required = ["project.read"]
optional = ["editor.read", "events"]

# code-actions includes the registered atomic repository FileActions.
[[contributes.providers]]
kinds = ["completion", "definition", "line-markers", "code-actions", "injections"]
languages = ["java", "kotlin"]

[[contributes.providers]]
kinds = ["diagnostics", "hover", "inlay-hints"]
languages = ["java", "kotlin"]

[contributes.settings]
schema = "settings.schema.json"
title = "Spring Data"

[[contributes.fileTemplates]]
id = "spring-data-repository-java"
name = "Spring Data Repository"
extension = "java"
path = "templates/Repository.java"

[[contributes.fileTemplates]]
id = "spring-data-repository-kotlin"
name = "Spring Data Repository (Kotlin)"
extension = "kt"
path = "templates/Repository.kt"

[[contributes.commands]]
id = "show-repository-members"
title = "Spring Data: Show Repository Inherited Members"
category = "Spring Data"

[[contributes.menus]]
menu = "editor.context"
command = "show-repository-members"
when = "editorLangId == java || editorLangId == kotlin"

[[contributes.markerIcons]]
id = "domain"
icon = "icons/marker-domain.svg"

[[contributes.markerIcons]]
id = "implementation"
icon = "icons/marker-implementation.svg"

[[contributes.markerIcons]]
id = "query"
icon = "icons/marker-query.svg"

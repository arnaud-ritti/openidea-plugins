id = "aritti.spring-graphql"
name = "Spring for GraphQL Tools"
version = "0.1.0" # x-release-please-version
description = "Spring for GraphQL in Java and Kotlin projects: links @QueryMapping, @MutationMapping, @SubscriptionMapping, @SchemaMapping and @BatchMapping controller methods to their schema fields (.graphqls) both ways with gutter arrows and Go to Definition, completes type and field names in the annotations, flags handlers or @Argument names the schema doesn't declare, and follows the fields of client documents (graphql-documents/*.graphql, inline .document(...)) to the schema. Independent implementation, not affiliated with JetBrains or Broadcom."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = "0.1.0 (first release): schema index, handler ↔ schema field navigation, annotation completion, unknown field/argument checks, unmapped root field hints."
categories = ["frameworks"]
engines.openidea = "^1.0"
wasm = "dist/plugin.wasm"
activation = ["on-language:java", "on-language:kotlin", "on-language:graphql"]

[capabilities]
required = ["project.read"]

[[contributes.providers]]
kinds = ["completion", "definition", "line-markers"]
languages = ["java", "kotlin"]

[[contributes.providers]]
kinds = ["definition", "line-markers"]
languages = ["graphql"]

id = "aritti.spring-initializr"
name = "Spring Initializr Launcher"
version = "0.1.0" # x-release-please-version
description = "Starts a Spring Boot project from a tool window. Pick the build, language, Spring Boot and Java versions, coordinates, packaging and dependencies. Generate Project then downloads the project zip from a Spring Initializr server (start.spring.io or your own) in the browser, and Explore in Browser opens the server's web page with the same options, and Generate with Spring Boot CLI runs `spring init` in an IDE terminal when the Spring Boot CLI is allowed. The plugin remembers the form. Independent implementation, not affiliated with JetBrains or Broadcom."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = "Unreleased: Dependencies section: browse the catalogue by category in a tree, with the chosen dependencies listed (and removable) under Selected, search, Clear all, and Boot-version compatibility filtering; replaces the Pick Dependencies button. README describes the pick lists and Add Spring Boot Starters. Pick Spring Boot Version and Pick Dependencies buttons (lists from start.spring.io), and an Add Spring Boot Starters command that inserts dependencies into the open pom.xml or build.gradle(.kts). 0.1.0: first release, with the Spring Initializr tool window (Generate Project and Explore in Browser) and the Open start.spring.io command."
categories = ["frameworks"]
icon = "icon.svg"
engines.openidea = "^1.2"
wasm = "dist/plugin.wasm"
activation = ["on-view:initializr"]

[capabilities]
required = ["storage"]
optional = ["process:spring", "net:start.spring.io", "editor.read", "editor.write"]

[[contributes.commands]]
id = "open-start"
title = "Spring Initializr: Open start.spring.io"
category = "Spring Initializr"

[[contributes.views]]
id = "initializr"
title = "Spring Initializr"
icon = "icons/springboot.svg"
location = "right"

[[contributes.commands]]
id = "add-starters"
title = "Spring Initializr: Add Spring Boot Starters"
category = "Spring Initializr"

[[contributes.menus]]
menu = "tools"
command = "add-starters"

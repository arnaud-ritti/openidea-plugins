id = "aritti.spring-integration"
name = "Spring Structure Tools"
version = "0.4.1" # x-release-please-version
description = "Spring Structure window and editor support for Spring Integration, Spring Batch and Spring Modulith. Integration: channel index for Java and XML, navigation and completion of channel names and bean refs, producer/consumer gutter arrows, unconsumed channel warnings. Batch: XML job navigation, completion and transition/bean checks, spring.batch.job.name navigation, Spring Batch 5 migration hints. Modulith: application module checks, allowedDependencies completion, open-module quick fix. One Spring Structure tool window switches between the integration channels, batch jobs, modulith modules and the module diagram; modules whose dependency the build files do not mention stay idle. Replaces aritti.spring-batch and aritti.spring-modulith: uninstall them to avoid duplicate windows and completions."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = """\
Next release: The Spring Structure window now appears only in Maven or Gradle projects, with plainer empty states and messages. New icon for channel producer and consumer markers, which open a chooser when a channel has several, and a Channel Table section with search; SpEL and XPath expressions in Integration XML and the Java DSL are checked, and XML with character entities keeps its features; Go to Definition on an XML channel finds channels in other files, and the index survives saves and covers generic classes, Gradle subprojects and Windows project roots; Modulith warns about use of module-internal types, and an unreadable file silences missing-channel and missing-bean warnings only for its own names; new commands to show the window and for toolbar actions, Batch Poll and Cancel only while a CLI runs and Cancel asks first, one name per command, plainer messages and Batch setting titles, shorter hover text and clearer permission messages, and large projects no longer stop the plugin while it reads them. \
0.3.0: channel and bean navigation, flow checks. \
0.2.0: plugin icon and channel markers."""
categories = ["frameworks"]
icon = "icon.svg"
engines.openidea = "^1.14"
wasm = "dist/plugin.wasm"
activation = [
    "on-language:java",
    "on-language:kotlin",
    "on-language:xml",
    "on-file:**/application*.properties",
    "on-file:**/application*.yml",
    "on-file:**/application*.yaml",
    "on-view:structure",
]

[capabilities]
required = ["project.read"]
optional = ["editor.read", "clipboard", "storage", "events", "process:java"]

[[contributes.providers]]
kinds = ["completion", "definition", "code-actions", "line-markers", "diagnostics", "hover"]
languages = ["java", "kotlin", "xml", "properties", "yaml"]

[[contributes.views]]
id = "structure"
title = "Spring Structure"
icon = "icons/structure.svg"
location = "right"
web = "web/resources/hub.html"
when = "workspaceContains:pom.xml || workspaceContains:build.gradle || workspaceContains:build.gradle.kts || workspaceContains:settings.gradle || workspaceContains:settings.gradle.kts"

[[contributes.commands]]
id = "batch.current-file-step-usages"
title = "Spring Batch: Find Step or Decision Usages in This Document"
category = "Spring Batch"

[[contributes.commands]]
id = "integration.current-file-channel-occurrences"
title = "Spring Integration: Find Channel Usages in This File"
category = "Spring Integration"

[[contributes.commands]]
id = "modulith.copy-docs"
title = "Spring Modulith: Copy Module Diagram (PlantUML)"
category = "Spring Modulith"

[[contributes.commands]]
id = "structure.refresh"
title = "Spring Structure: Refresh"
category = "Spring Structure"

[[contributes.commands]]
id = "structure.show"
title = "Spring Structure: Show Spring Structure Window"
category = "Spring Structure"
when = "workspaceContains:pom.xml || workspaceContains:build.gradle || workspaceContains:build.gradle.kts || workspaceContains:settings.gradle || workspaceContains:settings.gradle.kts"

[contributes.settings]
schema = "settings.schema.json"
title = "Spring Structure"

[[contributes.commands]]
id = "integration.import-tree-occurrences"
title = "Spring Integration: Find Channel Usages in XML Import Tree"
category = "Spring Integration"

[[contributes.commands]]
id = "batch.launch-command"
title = "Spring Batch: Generate Job Launch Command…"
category = "Spring Batch"

[[contributes.commands]]
id = "batch.runtime-validate"
title = "Spring Batch: Validate Configured CLI Profile"
category = "Spring Batch"

[[contributes.commands]]
id = "batch.runtime-operate"
title = "Spring Batch: Run Job Operation…"
category = "Spring Batch"

[[contributes.commands]]
id = "batch.runtime-poll"
title = "Spring Batch: Poll CLI Output"
category = "Spring Batch"
when = "plugin.aritti.spring-integration.batchCliActive"

[[contributes.commands]]
id = "batch.runtime-cancel"
title = "Spring Batch: Cancel CLI Process"
category = "Spring Batch"
when = "plugin.aritti.spring-integration.batchCliActive"

[[contributes.commands]]
id = "batch.runtime-inspect"
title = "Spring Batch: Inspect Execution Repository State"
category = "Spring Batch"

[[contributes.markerIcons]]
id = "channel"
icon = "icons/marker-channel.svg"

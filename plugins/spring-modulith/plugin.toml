id = "aritti.spring-modulith"
name = "Spring Modulith Tools"
version = "0.1.0"
description = "Spring Modulith support for Java projects. Treats each package directly under the @SpringBootApplication or @Modulithic package as an application module, warns when a module imports another module's internal types or a dependency its allowedDependencies doesn't list, completes and checks allowedDependencies in package-info.java, offers a quick fix to make a module open, and lists the modules with their named interfaces and dependencies in a Modules tool window. Independent implementation, not affiliated with JetBrains or Broadcom."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = "0.1.0 (first release): application module detection, checks for internal types and for dependencies missing from allowedDependencies, allowedDependencies completion and check, quick fix to make a module open, Modules tool window."
categories = ["frameworks"]
engines.openidea = "^1.0"
wasm = "dist/plugin.wasm"
activation = ["on-language:java", "on-view:modules"]

[capabilities]
required = ["project.read"]

[[contributes.providers]]
kinds = ["completion", "code-actions", "line-markers"]
languages = ["java"]

[[contributes.views]]
id = "modules"
title = "Modules"
icon = "module"
location = "left"

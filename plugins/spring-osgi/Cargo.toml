[package]
name = "openidea-plugin-aritti-spring-osgi"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# A plugin builds on its own (target wasm32-wasip2), outside any IDE workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", tag = "v0.1.37" }
spring-text = { path = "../../crates/spring-text" }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"

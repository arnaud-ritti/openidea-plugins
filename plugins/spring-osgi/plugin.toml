id = "aritti.spring-osgi"
name = "Spring OSGi"
version = "0.3.0" # x-release-please-version
description = "Spring Dynamic Modules (Spring OSGi) support for Spring XML files. Checks <osgi:service>, <osgi:reference>, <osgi:list>/<osgi:set> and their listeners: conflicting declarations, service beans that don't implement the exported interfaces, listener methods with a wrong signature, and listeners that don't implement OsgiServiceLifecycleListener. Adds Go to Definition and completion for bean references, exported interfaces and listener methods."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = "Unreleased: source-only XML checks do not require project/editor grants; source discovery and generation degrade through optional project/editor capabilities and fail without writes when denied.  exported service types must be source-established before mismatch errors; unknown inline factory types stay quiet and bean completion text is XML-escaped.  Java bean facts require owned annotation/literal-name metadata; computed, inner, profile and factory XML roles no longer prove global bean types, and missing-source-name Info messages retain incomplete provenance.  lazy generation resolution rechecks project-visible source text before and after prompts, refusing stale actual buffers while keeping host-owned atomic apply/undo.  cached OSGi source facts respect current innermost project ownership and cold-cache transitions after open-project/grant changes; navigation/completion alone warm files.  scoped OSGi/Beans XML namespace ownership for live checks/navigation/hover, quiet invalid-source cache recovery and scoped compendium tag suggestions; generation retains atomic source-local operations with strict XML validation.  unresolved ref, comparator-ref and depends-on reported as Info, ref completion sorts implementors of the exported interfaces first, osgix compendium tag completion. OSGi generation is available exclusively through lazy reviewed FileActions. 0.1.0 (first release): Spring OSGi inspections (elements inconsistency, service, listener) and reference navigation and completion."
categories = ["frameworks"]
icon = "icon.svg"
engines.openidea = "^1.9"
wasm = "dist/plugin.wasm"
activation = ["on-language:xml"]

[capabilities]
required = []
optional = ["project.read", "events"]

[[contributes.providers]]
kinds = ["completion", "definition", "diagnostics", "code-actions", "hover"]
languages = ["xml"]

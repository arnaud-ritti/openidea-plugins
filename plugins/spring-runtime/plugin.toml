id = "aritti.spring-runtime"
name = "Spring Runtime Insight"
version = "0.3.0" # x-release-please-version
description = "Reads the Actuator endpoints (beans, environment, conditions, health, mappings, configuration properties, scheduled tasks, loggers, caches) of a Spring Boot application running on localhost and shows them in a Spring Runtime tool window. Editor markers show which beans are loaded, and the runtime value and property source of @Value and configuration keys."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = "Unreleased: custom gutter icon for runtime value markers. Unreleased: Read JMX (localhost)… command: reviewed, read-only getAttribute snapshot (Runtime incl. masked InputArguments, Memory, Threading, OperatingSystem, Spring Boot Health/Info MBean attributes) of a local JVM started with -Dcom.sun.management.jmxremote.port=N (authenticate=false, ssl=false); localhost only, port 1024-65535, bounded output, 15 s timeout, shown as a JMX row in the cached snapshot details; needs optional process:java. Unreleased: runtime-to-source semantics: Auto-configuration shows positive/negative matches per class with Go to source for project classes (exact FQCN; library classes say so), Configuration Properties rows open the project @ConfigurationProperties class (exact type, else unique literal prefix; ambiguity refused) and show bound values with secrets masked, and mapping handlers resolve overloads by JVM descriptor parameter types; snapshot schema 3 migrates older caches (configprops values masked on read). the Health view lists Actuator component details (nested components up to depth 4, 200 nodes, bounded values) with password/secret/token/key/credential/auth values and URL userinfo masked before anything is stored; snapshot schema 2 reads schema 1 caches. the runtime request picker lists the last 10 distinct METHOD/path choices first (stored per project as method and path only; never URLs, headers, bodies or responses). cached snapshot-labeled @Value inlays in Java/Kotlin use physical closing-string anchors, omit source defaults and retain scope/redaction provenance.  one shared-kit runtime window with Overview, bounded Observation/Provenance details, Bean Graph and frame-owned visible polling controls, retaining scoped source navigation and explicit lifecycle checks.  Full 8 MiB project/URL/auth-mode snapshots; cache-only rendering/markers and last-good retention across failed/partial/oversized refreshes. Visible-view scoped opt-in polling; no native scheduled fetch. 0.1.0: first release, with the Actuator snapshot (refresh, clear and optional auto-refresh), the Spring Runtime tool window, runtime markers for beans, @Value and configuration keys, and hints for beans that aren't loaded."
categories = ["frameworks"]
icon = "icon.svg"
engines.openidea = "^1.9"
wasm = "dist/plugin.wasm"
activation = ["on-view:runtime", "on-language:java", "on-language:kotlin", "on-file:**/application*.properties", "on-file:**/application*.yml", "on-file:**/application*.yaml", "on-file:**/bootstrap*.properties", "on-file:**/bootstrap*.yml", "on-file:**/bootstrap*.yaml"]

[capabilities]
required = ["project.read", "storage"]
optional = ["process:java", "database.sources", "net:localhost", "net:127.0.0.1", "secrets", "clipboard", "project.write"]


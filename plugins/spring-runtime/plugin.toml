id = "aritti.spring-runtime"
name = "Spring Runtime Insight"
version = "0.4.1" # x-release-please-version
description = "Reads the Actuator endpoints (beans, environment, conditions, health, mappings, configuration properties, scheduled tasks, loggers, caches) of a Spring Boot application running on localhost and shows them in a Spring Runtime tool window. Editor markers show which beans are loaded, and the runtime value and property source of @Value and configuration keys."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = """\
Next release: An Open Settings button in the empty view, the window appears only in Maven or Gradle projects, and Clear Snapshot is hidden when there is nothing to clear and asks before deleting; new icon for runtime value markers, and markers for one project no longer reset another project's polling or view; Read JMX (localhost) shows memory, threads and health of a local JVM, and JMX Health and Info return real data; auto-configuration and properties rows open the matching source without re-scanning, Health lists component details, and secret-looking values are masked; recent requests and project beans are listed first, a timed-out endpoint keeps its previous data, Start Auto-Refresh starts right away, empty tabs offer Refresh, Observations row actions move to the right-click menu, and commands are named after their tabs with plainer messages, and large projects no longer stop the plugin while it reads them. \
0.3.0: runtime snapshot views and value hints. \
0.2.0: plugin icon and Actuator support."""
categories = ["frameworks"]
icon = "icon.svg"
engines.openidea = "^1.14"
wasm = "dist/plugin.wasm"
activation = ["on-view:runtime", "on-language:java", "on-language:kotlin", "on-file:**/application*.properties", "on-file:**/application*.yml", "on-file:**/application*.yaml", "on-file:**/bootstrap*.properties", "on-file:**/bootstrap*.yml", "on-file:**/bootstrap*.yaml"]

[capabilities]
required = ["project.read", "storage"]
optional = ["process:java", "database.sources", "net:localhost", "net:127.0.0.1", "secrets", "clipboard", "project.write", "ide.commands"]

[[contributes.commands]]
id = "refresh"
title = "Spring Runtime: Refresh from Actuator"
category = "Spring Runtime"

[[contributes.commands]]
id = "read-jmx"
title = "Spring Runtime: Read JMX (localhost)…"
category = "Spring Runtime"

[[contributes.commands]]
id = "clear"
title = "Spring Runtime: Clear Snapshot"
category = "Spring Runtime"

[[contributes.providers]]
kinds = ["line-markers"]
languages = ["java", "properties", "yaml"]

[[contributes.secrets]]
name = "actuator-token"
label = "Actuator token"
description = "A bearer token or API key for protected Actuator endpoints (with Basic authentication: user:password encoded in Base64). Used when the actuatorAuth setting is bearer or basic."

[[contributes.views]]
id = "runtime"
title = "Spring Runtime"
icon = "icons/spring.svg"
location = "bottom"
web = "web/resources/hub.html"
when = "workspaceContains:pom.xml || workspaceContains:build.gradle || workspaceContains:build.gradle.kts || workspaceContains:settings.gradle || workspaceContains:settings.gradle.kts"

[contributes.settings]
schema = "settings.schema.json"
title = "Spring Runtime Insight"

[[contributes.commands]]
id = "snapshot-details"
title = "Spring Runtime: Show Observations"
category = "Spring Runtime"

[[contributes.providers]]
kinds = ["inlay-hints"]
languages = ["properties", "yaml", "java", "kotlin"]

[[contributes.commands]]
id = "runtime-graph"
title = "Spring Runtime: Show Bean Graph"
category = "Spring Runtime"

[[contributes.commands]]
id = "runtime-controls"
title = "Spring Runtime: Show Refresh Controls"
category = "Spring Runtime"

[[contributes.commands]]
id = "poll-start"
title = "Spring Runtime: Start Auto-Refresh"
category = "Spring Runtime"

[[contributes.commands]]
id = "poll-stop"
title = "Spring Runtime: Stop Auto-Refresh"
category = "Spring Runtime"

[[contributes.commands]]
id = "configure-snapshot-database"
title = "Spring Runtime: Configure Database from Snapshot"
category = "Spring Runtime"

[[contributes.menus]]
menu = "tools"
command = "configure-snapshot-database"
when = "workspaceContains:pom.xml || workspaceContains:build.gradle || workspaceContains:build.gradle.kts || workspaceContains:settings.gradle || workspaceContains:settings.gradle.kts"

[[contributes.markerIcons]]
id = "runtime"
icon = "icons/marker-runtime.svg"

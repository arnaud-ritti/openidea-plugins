id = "aritti.spring-security"
name = "Spring Security Tools"
version = "0.3.2" # x-release-please-version
description = "Spring Security checks for Java, Kotlin and Spring XML that flag WebSecurityConfigurerAdapter, @EnableGlobalMethodSecurity, antMatchers/mvcMatchers/regexMatchers and authorizeRequests (removed or deprecated in Spring Security 6), redundant ROLE_ prefixes in hasRole/hasAnyRole, NoOpPasswordEncoder and {noop} passwords, with quick fixes where the change is mechanical. It also completes security expressions and role names in @PreAuthorize, @PostAuthorize, @PreFilter and @PostFilter and adds hover and go to definition for request matchers and security XML bean references."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = """\
Next release: Clearer role prefix findings that match Spring Security behaviour; @PreAuthorize and @PostAuthorize expressions are checked for typos and unknown parameters; more security XML checks, and unknown bean reference notes stay on as the index follows saved and changed files; path globs such as /api/** in Java comments no longer hide the rest of the file, the path matcher checks path patterns, and quick fixes and bean navigation work on Windows drives; shorter matcher hints and hover text, short setting titles and clearer permission messages, and large projects no longer stop the plugin while it reads them. \
0.3.0: filter chain and method security checks. \
0.2.0: plugin icon and XML checks."""
categories = ["frameworks"]
icon = "icon.svg"
engines.openidea = "^1.14"
wasm = "dist/plugin.wasm"
activation = ["on-language:java", "on-language:kotlin", "on-language:xml", "on-event:files-changed"]

[capabilities]
required = ["project.read"]
optional = ["events"]

[[contributes.providers]]
kinds = ["completion", "definition", "code-actions", "line-markers", "injections"]
languages = ["java", "kotlin", "xml"]

[[contributes.providers]]
kinds = ["diagnostics"]
languages = ["java", "kotlin", "xml"]

[[contributes.providers]]
kinds = ["hover", "inlay-hints"]
languages = ["xml", "java"]

[contributes.settings]
schema = "settings.schema.json"
title = "Spring Security"

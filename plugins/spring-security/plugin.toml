id = "aritti.spring-security"
name = "Spring Security Tools"
version = "0.1.0" # x-release-please-version
description = "Spring Security checks for Java. Flags WebSecurityConfigurerAdapter, @EnableGlobalMethodSecurity, antMatchers/mvcMatchers/regexMatchers and authorizeRequests (removed or deprecated in Spring Security 6), redundant ROLE_ prefixes in hasRole/hasAnyRole, NoOpPasswordEncoder and {noop} passwords, with quick fixes where the change is mechanical. Completes security expressions and the project's role names in @PreAuthorize, @PostAuthorize, @PreFilter and @PostFilter. Independent implementation, not affiliated with JetBrains or Broadcom."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = "Unreleased: wider hand-written XML tables (<http>, <method-security>, <csrf>, <headers>, <cors>, <custom-filter>, <concurrency-control>, boolean and enabled/disabled values, more bean references), Info for bean references no project bean answers (userDetailsServiceBeanName, @bean in security expressions, ref attributes in security XML), table checks of <http>, <intercept-url>, <user> and related XML elements, opt-in warning for self-invocation of method-security protected methods, Go to Definition from request matcher patterns to the controller mappings they cover. 0.1.0 (first release): Spring Security 6 migration checks with quick fixes, ROLE_ prefix and plain-text password checks, method security expression completion."
categories = ["frameworks"]
icon = "icon.svg"
engines.openidea = "^1.2"
wasm = "dist/plugin.wasm"
activation = ["on-language:java", "on-language:kotlin", "on-language:xml"]

[capabilities]
required = ["project.read"]

[[contributes.providers]]
kinds = ["completion", "definition", "code-actions", "line-markers"]
languages = ["java", "kotlin", "xml"]

[contributes.settings]
schema = "settings.schema.json"
title = "Spring Security"

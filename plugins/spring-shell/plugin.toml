id = "aritti.spring-shell"
name = "Spring Shell Tools"
version = "0.3.1" # x-release-please-version
description = "Spring Shell 3.x/4.x commands in Java and Kotlin projects, for both the @ShellComponent/@ShellMethod model and the @Command model. Checks availability methods (unknown command names, wrong return type), literal option/default/alias declarations and duplicate command names, completes command names, groups and provider beans, and links commands to their availability methods and providers."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = """\
Next release: Plainer wording for checks, the @ShellComponent fix and the rename preview. New icon for availability markers, and code lenses only for commands with more than one occurrence; hover and rename for commands inherited from a superclass, and rename refuses to run on a partly indexed project; availability lookup follows superclasses, and abstract base classes are no longer asked to add @ShellComponent; Spring Shell 3 and 4 commands are indexed, and deleted or moved files no longer cause false duplicate-command errors; one name per command, row commands say what to select, fixes on unsaved files ask you to save first, and fixes work with Windows drive-letter roots, and large projects no longer stop the plugin while it reads them. \
0.3.0: command navigation and availability checks. \
0.2.0: plugin icon and command markers."""
categories = ["frameworks"]
icon = "icon.svg"
engines.openidea = "^1.14"
wasm = "dist/plugin.wasm"
activation = ["on-language:java", "on-language:kotlin", "on-event:files-changed"]

[capabilities]
required = ["project.read"]
optional = ["editor.read", "events"]

[[contributes.providers]]
kinds = ["completion", "definition", "line-markers", "diagnostics", "hover", "code-actions"]
languages = ["java", "kotlin"]

[[contributes.commands]]
id = "command-occurrences"
title = "Spring Shell: Find Command Occurrences"
category = "Spring Shell"

[[contributes.providers]]
kinds = ["document-highlights", "code-lenses"]
languages = ["java", "kotlin"]

[[contributes.markerIcons]]
id = "availability"
icon = "icons/marker-availability.svg"

id = "aritti.spring-web"
name = "Spring Web Tools"
version = "0.1.0"
description = "Spring MVC helpers for Java controllers. Checks @PathVariable parameters against the URI templates of their request mappings, with a quick fix for a misnamed variable, and links the view names a @Controller returns to their template files (Thymeleaf, FreeMarker, Mustache, Pebble, JTE, JSP) with gutter arrows, Go to Definition and completion. Independent implementation, not affiliated with JetBrains or Broadcom."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = "0.1.0 (first release): path variable checks with a quick fix, view name navigation and completion."
categories = ["frameworks"]
engines.openidea = "^1.0"
wasm = "dist/plugin.wasm"
activation = ["on-language:java"]

[capabilities]
required = ["project.read"]

[[contributes.providers]]
kinds = ["completion", "definition", "line-markers", "code-actions"]
languages = ["java"]

id = "aritti.spring-web"
name = "Spring Endpoints Tools"
version = "0.3.0" # x-release-please-version
description = "Spring Endpoints window and editor support for Spring MVC, WebSocket, messaging, GraphQL, Web Flow and Spring Cloud. Web: checks @PathVariable parameters against the URI templates of their request mappings with a quick fix, links the view names a @Controller returns to their template files, links functional routes and test URLs to their handlers, checks API version values, and offers actions that add a @RequestMapping or @ExceptionHandler method. WebSocket: STOMP destinations linked between handlers, sends and JavaScript/TypeScript clients. Messaging: Kafka, RabbitMQ and JMS destinations. GraphQL: controller methods linked to schema fields. Web Flow: flow definitions with a state diagram. Cloud: OpenFeign clients, Stream function bindings and Gateway predicates. One Spring Endpoints tool window switches between the HTTP route list, WebSocket destinations, messaging destinations, GraphQL endpoints, the Web Flow diagram and Feign clients; modules whose dependency the build files do not mention stay idle. Replaces aritti.spring-websocket, aritti.spring-messaging, aritti.spring-graphql, aritti.spring-webflow and aritti.spring-cloud: uninstall them to avoid duplicate windows and completions."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = "Unreleased parity: GraphQL RuntimeWiring registrations are recognised only on a proven RuntimeWiring.Builder receiver (configure parameter or lambda parameter), verified against Spring for GraphQL and graphql-java source. Spring MVC #{...} SpEL in @RequestParam, @RequestHeader and @CookieValue defaultValue is injected as spel behind the existing thymeleafSpelInjection opt-in (JSP EL injection and curl lenses for client calls are not implemented). XML <mvc:view-controller view-name> and Java addViewController(...).setViewName(...) navigate to their templates; th:replace '~{layout :: #id}' selectors jump to the unique element with that id; literal RuntimeWiringConfigurer data fetcher registrations are GraphQL handlers and relax the unmapped-field hint gate only when every wiring mention is a recognised registration. Gateway Weight expanded keys are weight.group/weight.weight with group required, Retry shortcut limit 9 (jitter, timeout on latest main); literal RabbitTemplate convertAndSend/send calls link to the exchange's BindingBuilder routing key (Info for an unbound key on a complete index). MVC OpenAPI export maps literal Bean Validation constraints and regex path-variable patterns, emits literal @ResponseStatus/ResponseEntity codes and lists ant-pattern mappings as unexported. Spring @HttpExchange/@GetExchange/@PostExchange/@PutExchange/@DeleteExchange/@PatchExchange interfaces listed as client endpoints with request drafts, Feign contextId/configuration shown; MVC XML bean refs resolve through local <import> closures and <beans profile> blocks (Info for profile-only and undeclared beans), <mvc:resources> locations checked under src/main/resources and src/main/webapp. Endpoints window shows literal @RequestMapping names (class#method); GraphQL Info hint for unhandled argument fields on served object types when the handler set is provably complete; messaging placeholders resolve only for unambiguous property keys and BindingBuilder chains link queue/exchange/routing key. MockMvc/WebTestClient/RestClient/TestRestTemplate/RestTemplate/WebClient test-URL completion now requires a same-file declared and exactly imported receiver (the old name heuristics are removed); @SessionAttributes names in template completion; Gateway arity and arg tables for 14 more factories (spring-cloud-gateway 4.1.5), pure .or() predicate chains in the Java DSL; Java-config Web Flow registries (addFlowLocation/setBasePath). ControllerAdvice @ModelAttribute names in template completion/navigation and argument-bearing Thymeleaf fragment calls; unknown expanded Gateway factory args and shortcut/expanded arity warnings for ignored extra or missing required values (verified against spring-cloud-gateway 4.1.5); Kotlin aliased Spring GraphQL imports and stricter BatchMapping return types; WebSocket XML false-positive removal (path/prefix not required) plus enum and bean-ref checks, JMS/Rabbit XML enum and ref checks. annotated handler identities; HTTP request-file path completion/navigation; literal template assets/fragments; declaration-only OpenAPI export; project Gateway factory completion and expanded name checks. Unreleased: absorbs aritti.spring-websocket, aritti.spring-messaging, aritti.spring-graphql, aritti.spring-webflow and aritti.spring-cloud into one Spring Endpoints window with HTTP, WebSocket, Messaging, GraphQL, Web Flow and Feign sections; uninstall those five ids, they are no longer maintained and would show duplicate windows and completions. Settings of the absorbed plugins keep their keys but their old values are not migrated. URL gutter markers on request mappings, mapping URL completion in test URL literals, Go to Definition from static resource literals, getm/postm/putm/delm/patm/reqm snippets, Controller/REST Controller/Controller Advice file templates (Java, Kotlin), path variable checks for Kotlin controllers, opt-in hint for unresolved view names, <mvc:...> attribute checks, hint for apiVersion() in tests without an ApiVersionInserter. Endpoints now list as flat routes (method icon, path, [GET] controller) with a controller filter and a Flat/Tree toggle; Copy as curl on the Endpoints context menu (needs the optional clipboard capability). Create HTTP Request File for Endpoint writes http/<verb>-<path>.http under the project root (optional process:tee, clipboard fallback); the unresolved-view hint is now on by default but quiet when a source defines its own ViewResolver; controller, REST controller, advice, exception handler, init binder and router snippets; the generate actions, the api-version and @InitBinder checks also run on Kotlin controllers; more <mvc:...> attribute checks. 0.1.0 (first release): path variable checks with a quick fix, view name navigation and completion, API version format check, generate actions for request mapping and exception handler methods, Endpoints tool window."
categories = ["frameworks"]
icon = "icon.svg"
engines.openidea = "^1.9"
wasm = "dist/plugin.wasm"
activation = [
    "on-language:java",
    "on-language:http",
    "on-language:html",
    "on-language:jsp",
    "on-language:kotlin",
    "on-language:xml",
    "on-language:javascript",
    "on-language:javascriptreact",
    "on-language:typescript",
    "on-language:typescriptreact",
    "on-language:vue",
    "on-language:graphql",
    "on-file:**/application*.yml",
    "on-file:**/application*.yaml",
    "on-file:**/application*.properties",
    "on-file:**/bootstrap*.yml",
    "on-file:**/bootstrap*.yaml",
    "on-file:**/bootstrap*.properties",
    "on-view:endpoints",
    "on-event:files-changed",
]

[capabilities]
required = ["project.read"]
optional = ["project.write", "clipboard", "process:tee", "editor.read", "events", "storage", "process:node"]


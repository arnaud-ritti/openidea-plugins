id = "aritti.spring-ws"
name = "Spring Web Services Tools"
version = "0.3.0" # x-release-please-version
description = "Spring Web Services endpoints in Java and Kotlin projects. Links @PayloadRoot methods of @Endpoint classes to the top-level elements of the project's XML schemas (.xsd files and schemas inside .wsdl files) and back, completes element names in localPart, warns about elements missing from a schema and about ClassPathResource schema files missing from the resources, and shows where a DefaultWsdl11Definition bean is published."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = "Unreleased: custom gutter icons for schema element, endpoint handler and WSDL markers. DefaultWsdl11Definition bean literals (Java method with the whole definition visible, or XML bean): Warning wsdl-missing-port-type-name and wsdl-missing-schema (Spring-WS asserts portTypeName and schema/schemaCollection; locationUri is only an Info, wsdl-missing-location-uri, as it is not enforced), and the same Request/Response pairing Info for a SimpleXsdSchema classpath/ClassPathResource literal resolving to one project XSD; partial, dynamic or unresolved definitions stay quiet. dynamic-wsdl: Info (wsdl-unpaired-request) when a literal classpath xsd declares an XRequest element with no XResponse in the referenced schemas (default or literal request/response suffixes; Spring-WS pairs them into operation X); unresolved, ambiguous, incomplete or dynamic locations stay quiet. @Endpoint handlers: Info (void-response-payload) for @ResponsePayload on a void Java @PayloadRoot method (Spring-WS ignores the annotation for void; harmless). WSDL 1.1 QName references in project .wsdl files: message part element/type navigate to inline or locally imported/included XSD declarations (prefix bound via in-scope xmlns, XSD targetNamespace, bounded relative local imports, cycle-safe); portType message, binding type and port binding navigate to same-document definitions. Unresolved-reference warnings (unresolved-wsdl-reference) only when every import resolved locally and the namespace is known; unprefixed, chameleon, URL and unknown-namespace values stay quiet. Undeclared XPath prefix warnings (undeclared-xpath-prefix) for literal @XPathParam values: reported only when package/class/method @Namespace(s) (the sole source Spring-WS NamespaceUtils reads; reserved xml/xmlns always bound) all parse, every project Java/Kotlin/XML file and package-info.java was scanned, and nothing mentions XPathParamAnnotationMethodEndpointAdapter, XPathParamMethodArgumentResolver or NamespaceUtils; otherwise quiet. Strict XPath 1.0 syntax warnings (invalid-xpath) for literal @XPathParam values and XPathExpressionFactory.createXPathExpression literals; non-literal, concatenated, escaped and unowned values stay quiet; no prefix or evaluation checks. Spring-WS XML checks from web-services-2.0.xsd: undeclared attributes on sws elements, disallowed children and missing bean/ref children in interceptors, payloadRoot and soapAction; prefixed attributes, foreign namespaces and placeholders stay quiet. Current Spring-WS XML required/boolean contracts, annotation-driven/OXM/CXF bean references, owned project class assistance and explicit source refresh; XPath prefix links/completion beyond root names. Owned adjacent package-info namespace cache and watcher freshness; package/class/method XPath binding composition with fresh explicit-occurrence authority revalidation. Source-owned Namespace/Namespaces URI assistance, exact absolute XPath root QName links/completion and read-only occurrences; interceptor payloadRoot selectors share known QName identity. Local bean definition/completion now supports Spring-WS interceptors and payloadRoot/soapAction-scoped Beans ref children with namespace ownership. Add read-only observed QName occurrence navigation with exact namespace identity, source ownership and current-source revalidation; no implicit host Rename graph. Unreleased: explicit XPath adapter namespaces props URI values gain cached schema namespace navigation/completion with strict source ownership, unique schema targets and quiet unknown contexts; no XPath evaluation or network fetch. endpoint QName links/candidates require exact namespace matches; source ClassPathResource ownership and cache-only navigation suppress guessed targets. all nine established scalar resource roles gain cached literal classpath completion with prefix/UTF16/full-value replacement and project/namespace/ambiguity guards. exact XSLT request/response and security policy XML source properties navigate through an independent bounded lifecycle-owned resource path inventory; no resource execution or QName inference. generation refuses escaped/interpolated existing QName mappings and requires consistent explicit annotation ownership for source-established package evidence. endpoint, PayloadRoots and each PayloadRoot require explicit supported source annotation ownership; foreign/unimported/shadowed names stay quiet. sws location links and missing-resource checks now require well-formed namespace-valid XML; invalid reserved-prefix/current source contexts stay quiet. endpoint namespace constants require unique literal source ownership; mutable/unrelated/escaped/dynamic facts cannot trigger missing-element warnings. original-backed scalar XSD/WSDL constructor resource navigation and PayloadValidatingInterceptor.schema navigation, with existing namespace/path/cache guards. namespace-owned literal XSD/WSDL QNames and separate QName completeness suppress false missing-element claims from malformed/foreign/import-dependent schemas; resource-path inventory stays separate. 0.1.0 (first release): endpoint ↔ schema element navigation, localPart completion and check, classpath resource navigation and check, WSDL publication hint."
categories = ["frameworks"]
icon = "icon.svg"
engines.openidea = "^1.9"
wasm = "dist/plugin.wasm"
activation = ["on-language:java", "on-language:kotlin", "on-language:xml", "on-event:files-changed"]

[capabilities]
required = ["project.read"]
optional = ["events", "editor.read"]

[[contributes.providers]]
kinds = ["completion", "definition", "line-markers"]
languages = ["java", "kotlin"]

[[contributes.providers]]
kinds = ["line-markers", "definition", "completion"]
languages = ["xml"]

# XML requests also keep the current XSD/WSDL snapshot cached.
[[contributes.providers]]
kinds = ["diagnostics"]
languages = ["java", "kotlin", "xml"]

[[contributes.providers]]
kinds = ["code-actions"]
languages = ["xml"]

[[contributes.commands]]
id = "qname-occurrences"
title = "Spring WS: Find Observed QName Occurrences"
category = "Spring WS"

[[contributes.commands]]
id = "refresh-models"
title = "Spring WS: Refresh Source Models"
category = "Spring WS"

[[contributes.markerIcons]]
id = "schema"
icon = "icons/marker-schema.svg"

[[contributes.markerIcons]]
id = "endpoint"
icon = "icons/marker-endpoint.svg"

[[contributes.markerIcons]]
id = "wsdl"
icon = "icons/marker-wsdl.svg"

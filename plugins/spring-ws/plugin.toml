id = "aritti.spring-ws"
name = "Spring Web Services Tools"
version = "0.3.1" # x-release-please-version
description = "Spring Web Services endpoints in Java and Kotlin projects. Links @PayloadRoot methods of @Endpoint classes to the top-level elements of the project's XML schemas (.xsd files and schemas inside .wsdl files) and back, completes element names in localPart, warns about elements missing from a schema and about ClassPathResource schema files missing from the resources, and shows where a DefaultWsdl11Definition bean is published."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = """\
Next release: New icons for schema element, endpoint and WSDL markers, which open a chooser when several schemas or endpoints match; DefaultWsdl11Definition beans are checked for missing port type and schema, and unpaired Request/Response elements are flagged; WSDL references navigate to their schema and definitions, and large schemas are no longer treated as invalid; indexes stay current after file batches, deleted schemas and idle periods, only projects that depend on Spring-WS are scanned, and missing classpath resources are Info; one name per command, plainer command titles (Find Element Usages, Refresh Schemas and Endpoints) and messages, a plain endpoint scaffold flow, settings to turn each check off, and Find Element Usages says when its search was capped, and large projects no longer stop the plugin while it reads them. \
0.3.0: WSDL and endpoint navigation and checks. \
0.2.0: plugin icon and schema navigation."""
categories = ["frameworks"]
icon = "icon.svg"
engines.openidea = "^1.14"
wasm = "dist/plugin.wasm"
activation = ["on-language:java", "on-language:kotlin", "on-language:xml", "on-event:files-changed"]

[capabilities]
required = ["project.read"]
optional = ["events", "editor.read"]

[[contributes.providers]]
kinds = ["completion", "definition", "line-markers"]
languages = ["java", "kotlin"]

[[contributes.providers]]
kinds = ["line-markers", "definition", "completion"]
languages = ["xml"]

# XML requests also keep the current XSD/WSDL snapshot cached.
[[contributes.providers]]
kinds = ["diagnostics"]
languages = ["java", "kotlin", "xml"]

[[contributes.providers]]
kinds = ["code-actions"]
languages = ["xml"]

[contributes.settings]
schema = "settings.schema.json"
title = "Spring Web Services"

[[contributes.commands]]
id = "qname-occurrences"
title = "Spring WS: Find Element Usages"
category = "Spring WS"

[[contributes.commands]]
id = "refresh-models"
title = "Spring WS: Refresh Schemas and Endpoints"
category = "Spring WS"

[[contributes.markerIcons]]
id = "schema"
icon = "icons/marker-schema.svg"

[[contributes.markerIcons]]
id = "endpoint"
icon = "icons/marker-endpoint.svg"

[[contributes.markerIcons]]
id = "wsdl"
icon = "icons/marker-wsdl.svg"

id = "aritti.symfony"
name = "Symfony"
version = "0.2.0" # x-release-please-version
description = """Symfony support in PHP, Twig, YAML and XML files. Completion and go to definition for routes, \
Twig templates and blocks, services, classes, translation keys (per domain), assets, Encore and AssetMapper entries, \
and roles, plus completion of the variables controllers pass to a Twig template. Reports missing routes, templates, \
services and translation keys, and routes defined twice in a file, with a quick fix that adds a missing key. Gutter markers link controllers, templates, \
parent blocks, classes and service definitions. A Symfony tool window lists routes, templates, services and \
translations, two commands run cache:warmup and cache:clear, and a Profiler view lists the latest requests. \
Partial port of the Symfony Plugin for IntelliJ by Daniel Espendiller and Adrien Brault (MIT). \
Twig files need the aritti.twig plugin."""
authors = ["Arnaud Ritti <arnaud.ritti@gmail.com>", "Daniel Espendiller (original Symfony Plugin)", "Adrien Brault (original Symfony Plugin)"]
homepage = "https://github.com/Haehnchen/idea-php-symfony2-plugin"
license = "MIT"
change-notes = """0.1.0: first release. Ported from the Symfony Plugin (fr.adrienbrault.idea.symfony2plugin) 2026.2.314, \
source revision b6c1034f6669784d7a58de7535515b7da93db87e. This port works from a text index of the project, so the \
features that need PhpStorm's PSI are missing (container type inference, Doctrine, forms, most inspections)."""
categories = ["frameworks"]
engines.openidea = "^1.0"
wasm = "dist/plugin.wasm"
activation = ["on-language:php", "on-language:twig", "on-language:yaml", "on-language:xml", "on-view:symfony-profiler"]

[capabilities]
required = ["project.read"]
# Cache: Warm Up / Clear run `php bin/console`; everything else works without it.
# events: problems refresh on open and save; without it they are not published.
optional = ["process:php", "events"]

[[contributes.commands]]
id = "reindex"
title = "Symfony: Reindex Project"
category = "Symfony"

[[contributes.commands]]
id = "show-profiler"
title = "Symfony: Show Profiler"
category = "Symfony"

[[contributes.commands]]
id = "cache-warmup"
title = "Symfony: Warm Up Cache"
category = "Symfony"

[[contributes.commands]]
id = "cache-clear"
title = "Symfony: Clear Cache"
category = "Symfony"

[[contributes.providers]]
kinds = ["completion", "definition", "line-markers", "code-actions"]
languages = ["php", "twig", "yaml", "xml"]

[[contributes.views]]
id = "symfony"
title = "Symfony"
icon = "file-php"
location = "right"

[[contributes.views]]
id = "symfony-profiler"
title = "Symfony Profiler"
icon = "file-php"
location = "bottom"

[contributes.settings]
schema = "settings.schema.json"
title = "Symfony"

[[contributes.fileTemplates]]
id = "command"
name = "Symfony Command"
extension = "php"
path = "templates/Command.php"

[[contributes.fileTemplates]]
id = "controller"
name = "Symfony Controller"
extension = "php"
path = "templates/Controller.php"

[[contributes.fileTemplates]]
id = "form-type"
name = "Symfony Form Type"
extension = "php"
path = "templates/FormType.php"

[[contributes.fileTemplates]]
id = "twig-extension"
name = "Symfony Twig Extension"
extension = "php"
path = "templates/TwigExtension.php"

[[contributes.fileTemplates]]
id = "compiler-pass"
name = "Symfony Compiler Pass"
extension = "php"
path = "templates/CompilerPass.php"

[[contributes.fileTemplates]]
id = "kernel-test"
name = "Symfony Kernel Test"
extension = "php"
path = "templates/KernelTest.php"

[[contributes.fileTemplates]]
id = "web-test"
name = "Symfony Web Test"
extension = "php"
path = "templates/WebTest.php"

[[contributes.fileTemplates]]
id = "event-subscriber"
name = "Symfony Event Subscriber"
extension = "php"
path = "templates/EventSubscriber.php"

[[contributes.fileTemplates]]
id = "voter"
name = "Symfony Voter"
extension = "php"
path = "templates/Voter.php"

[[contributes.fileTemplates]]
id = "services-yaml"
name = "Symfony Service Config (YAML)"
extension = "yaml"
path = "templates/ServicesYaml.yaml"

[[contributes.fileTemplates]]
id = "services-xml"
name = "Symfony Service Config (XML)"
extension = "xml"
path = "templates/ServicesXml.xml"

[[contributes.fileTemplates]]
id = "services-php"
name = "Symfony Service Config (PHP)"
extension = "php"
path = "templates/ServicesPhp.php"

[[contributes.fileIcons]]
id = "symfony"
patterns = ["services.yaml", "services.yml", "routes.yaml", "routes.yml", "bundles.php", "symfony.lock"]
icon = "icons/symfony.svg"
iconDark = "icons/symfony_dark.svg"

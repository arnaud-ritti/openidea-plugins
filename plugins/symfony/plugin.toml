id = "aritti.symfony"
name = "Symfony"
version = "0.4.0" # x-release-please-version
description = """Symfony support in PHP, Twig, YAML and XML files: completion, go to definition, checks and quick fixes for routes, templates, services, translation keys, assets, Twig components and Doctrine entities, renames for routes, templates, translation keys and service ids, and links to the Symfony docs in hovers. A Symfony tool window lists routes, templates, components, services, events, config, translations and entities, compares Doctrine mappings with the database, sends requests through the app kernel, reads the log and Messenger failed messages, runs console commands and MakerBundle makers, and shows the profiler. Console commands, requests and run configurations can run in a Docker container. Twig files need the aritti.twig plugin."""
authors = ["Arnaud Ritti <arnaud.ritti@gmail.com>"]
homepage = "https://github.com/arnaud-ritti/openidea-plugins/tree/main/plugins/symfony"
license = "MIT"
change-notes = """\
Next release: console commands, Send Request, the Database tab and run configurations can run in a Docker container picked with Choose Docker Target…, and through php-win on Windows; the bottom tool window has new Request, Database, Runtime, Console, Generators, Components and Events tabs: send routes with changes rolled back, compare mappings with the database, read the log, retry messages, run commands and makers; route links above controller methods, docs links in hovers, and ⌥⏎ to generate a functional test, extract a template or translation key, inject instead of the container, add validation constraints, create or extract request DTOs, rename templates, translation keys and service ids; Create Missing Template or Class…, Find Unused Templates, Run Command from Class…, New Symfony Project… and MCP tools that run console commands; Routes and Services tabs in Search Everywhere, a status bar menu, coloured Run consoles, completion for Stimulus, Vite, Twig components and typed members, faster saves, Related files icons, route rename updates every usage, no crashes on accents, emoji or big projects. \
0.3.0: indexer, Twig and Doctrine support. \
0.2.0: plugin icon and route navigation."""
categories = ["frameworks"]
icon = "icon.svg"
engines.openidea = "^1.14"
wasm = "dist/plugin.wasm"
activation = ["on-view:symfony", "on-file:**/composer.json", "on-language:php", "on-language:twig", "on-language:yaml", "on-language:xml"]

[capabilities]
required = ["project.read"]
# Cache: Warm Up / Clear, the database commands and the Console and Generators tabs run `php bin/console`, and the PHP run configurations (built-in server, tests, workers) run `php`; Send Request and the Database tab's Compare and Rows run the app kernel in a php process; everything else works without it.
# process:php-win: on Windows, background PHP (console commands, Send Request) runs through php-win with no console window; php otherwise.
# process:docker: Symfony: Choose Docker Target… lists containers; console commands, Send Request and the Database tab then run through `docker exec`, and the PHP run configurations too when the container was picked for this project (storage keeps the choice).
# process:symfony: the Processes tab opens `symfony serve` / `symfony server:log` in a terminal tab, New Symfony Project runs `symfony new`, and the Symfony: Serve run configuration runs `symfony serve --no-tls`; Messenger and scheduler workers use process:php.
# process:composer: New Symfony Project runs `composer create-project symfony/skeleton` when the symfony CLI is unavailable.
# process:php also runs bin/console messenger:failed:show/retry/remove for the Runtime tab's failed messages; its logs are read as files.
# editor.*: Twig: Extend Template inserts the extends tag.
# events: cross-file problems refresh on open/save; source-local syntax uses the live provider.
# Missing-template creation uses reviewed native FileActions, with no process grant; a missing class runs `php bin/console make:*` in a terminal.
# database.sources: Symfony: Add Database to IDE… adds the app's Doctrine connections to the IDE's Database tool window (no password); Symfony: Manage Database Connections… connects or removes them.
optional = ["project.write", "process:php", "process:php-win", "process:docker", "process:symfony", "process:composer", "events", "editor.read", "editor.write", "clipboard", "storage", "database.sources"]


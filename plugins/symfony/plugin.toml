id = "aritti.symfony"
name = "Symfony"
version = "0.1.0" # x-release-please-version
description = """Symfony support in PHP, Twig, YAML and XML files. Completion and go to definition for routes, \
Twig templates and blocks, services, classes, translation keys (per domain), assets, Encore and AssetMapper entries, \
and roles, plus completion of the variables controllers pass to a Twig template. Reports missing routes, templates, \
services and translation keys, and routes defined twice in a file, with a quick fix that adds a missing key. Gutter markers (several targets open a chooser) link controllers, templates, \
parent blocks, classes and service definitions. A Symfony tool window lists routes, templates, services and \
translations, two commands run cache:warmup and cache:clear, and a Profiler view lists the latest requests. \
Partial port of the Symfony Plugin for IntelliJ by Daniel Espendiller and Adrien Brault (MIT). \
Twig files need the aritti.twig plugin."""
authors = ["Arnaud Ritti <arnaud.ritti@gmail.com>", "Daniel Espendiller (original Symfony Plugin)", "Adrien Brault (original Symfony Plugin)"]
homepage = "https://github.com/Haehnchen/idea-php-symfony2-plugin"
license = "MIT"
change-notes = """0.1.0: first release. Ported from the Symfony Plugin (fr.adrienbrault.idea.symfony2plugin) 2026.2.314, \
source revision b6c1034f6669784d7a58de7535515b7da93db87e. This port works from a text index of the project, so the \
features that need PhpStorm's PSI are missing (container type inference, Doctrine, forms, most inspections). \
Unreleased: the unclosed-tag diagnostic moved to aritti.twig, which now reports it in Symfony projects too; project-wide Go to Declaration for service ids and route names (YAML and XML services, attribute, YAML and XML routes; @service, path() and generate() references) from the host's document index. \
Also new in this release (unverified in the IDE): Twig checks (assets tags, enum() classes, content outside blocks in extending templates, hard-coded paths with a quick fix); container reference checks (unknown %parameters%, missing service classes, deprecated classes) and service wiring checks (argument count and types, tag interfaces, listener methods, !php/const); practice hints and more version-gated deprecations for PHP; Doctrine removed-API checks; typo quick fixes for routes, templates, keys and domains; rewrites (Doctrine alias to ::class, command to invokable, Twig extension to attributes); service definition, argument resync and tag generators; Extract translation and Add form fields actions; Twig variable collectors; attribute argument completion; index links for events, macros, voters and validators; extra file templates and the extraServiceFiles, extraRoutingFiles and practiceChecks settings. Also from the index: console command names, %parameters%, filters, functions and tests of the project's Twig extensions, UX Twig components and Stimulus controllers; gutter markers moved onto the index, so a template lists all its controllers, a block all its overriding templates and a route its path() uses. New commands: Run Console Command, Go to Route, Service, Console Command and Template, Extend Twig Template."""
categories = ["frameworks"]
icon = "icon.svg"
engines.openidea = "^1.2"
wasm = "dist/plugin.wasm"
activation = ["on-language:php", "on-language:twig", "on-language:yaml", "on-language:xml", "on-view:symfony-profiler"]

[capabilities]
required = ["project.read"]
# Cache: Warm Up / Clear run `php bin/console`; everything else works without it.
# editor.*: Twig: Extend Template inserts the extends tag.
# events: problems refresh on open and save; without it they are not published.
optional = ["process:php", "events", "editor.read", "editor.write"]


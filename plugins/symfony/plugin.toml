id = "aritti.symfony"
name = "Symfony"
version = "0.3.0" # x-release-please-version
description = """Symfony support in PHP, Twig, YAML and XML files. Completion and go to definition for routes, Twig templates and blocks, services, classes, translation keys (per domain), assets, Encore and AssetMapper entries, and roles, plus completion of the variables controllers pass to a Twig template. Reports missing routes, templates, services and translation keys, and routes defined twice in a file, with a quick fix that adds a missing key. Cached declaration hover shows source candidates; unsafe host-index Rename associations and graph-only gutter links are gated. A Symfony tool window lists routes, templates, services and translations, two commands run cache:warmup and cache:clear, and a Profiler view lists the latest requests. Twig files need the aritti.twig plugin."""
authors = ["Arnaud Ritti <arnaud.ritti@gmail.com>"]
homepage = "https://github.com/arnaud-ritti/openidea-plugins/tree/main/plugins/symfony"
license = "MIT"
change-notes = """Unreleased: About tab with project metadata, installed versions, index counts and a Run bin/console about button. Unreleased: Config, Env and Entities tabs (container parameter names, `.env` variable names without values, Doctrine entities with fields and relations) and matching MCP tools. Unreleased: Six read-only MCP tools (routes, services, commands, templates, template usage, profiler requests); Stimulus controller, Vite entry and AssetMapper path completion; `{% types %}`, `enum_cases()` and route-parameter completion; UX Twig component names, props, blocks and navigation. Unreleased: Member completion, Go to Definition and hover from inferred types, including `for` loops over typed collections, `$this->`, `container->get('service.id')`, query-builder results, and form fields and options: `variable.` in Twig (from `{# @var #}` comments and controller `render()` arguments) and `$variable->` in PHP (typed parameters and properties, `new`, repository and entity-manager finders, `container->get(Class::class)`). Unreleased: The window has separate Routes, Templates, Services and Translations tabs with counts, and a Processes tab that opens the Symfony CLI server, server log and Messenger/scheduler workers in terminal tabs. Unreleased: Unreleased: indexer gutter markers (services, events, validators, templates, blocks, routes) use dedicated icons. Unreleased form and column type checks (Info): EntityType `class` and CollectionType `entry_type` naming a missing project class, EntityType `choice_label` that is no property or getter of the class, CheckboxType on a property declared int/float/array (Symfony docs: a boolean value, and the `value` option does not change the object value; string is not flagged; Integer/Number/Date types are not checked because their docs allow several underlying types); literal `ORM Column type` attributes string/text/integer/boolean/float/datetime_immutable against a built-in property type per the DBAL types mapping, skipped with `enumType`. Unreleased autowiring and route references: Go to Definition on a constructor type-hint reaches the service definition (explicit service or `alias:`/`Interface: '@Class'` alias, `#[AsAlias]` on a class, or a `resource:`-loaded concrete class whose FQCN equals namespace plus path; plain-path `exclude` honoured, globs and `#[Autowire]`/`#[Target]` parameters stay quiet); `generateUrl()`/`redirectToRoute()`/router `generate()` of an unknown literal route name warns when the route set is provably literal (src/Controller attribute imports only, every `#[Route]` named by a string, no name_prefix, PHP route files or custom router resource) without needing compiled routes; `_` and FQCN/`Class::method` route names stay quiet. Unreleased Doctrine navigation: Go to Declaration from `repositoryClass:` and `targetEntity:` class literals to the class, and from `mappedBy:`/`inversedBy:` strings to the exact property declaration in the target entity (same file-indexed edges as service ids; quiet when unresolved). Unreleased Doctrine/forms reference checks: warns when an association `mappedBy`/`inversedBy` names a property missing from the readable `targetEntity` class chain, and reports Info for `$builder->add()` fields of a form with `data_class` that match no entity property or accessor (silent with mapped/property_path/data/inherit_data, traits, magic accessors or unreadable parents). Profiler details show up to 50 Time collector Stopwatch events (name, category, origin, duration, period count) decoded only from plain StopwatchEvent/StopwatchPeriod shapes with printable-ASCII allowlists; cloned or malformed periods omit the duration; additive to profile summary protocol v2. Unreleased profiler details: decodes Time (start time, stopwatch), Cache (calls/reads/writes/deletes/hits/misses/time totals) and Logger (deprecation/warning/scream counts) collector numbers from raw/GZIP profiles against Symfony 7.4 data shapes; adapter protocol is now version 2. Events/Request collectors stay count-only because their data is VarDumper-cloned. Unreleased profiler paging: the Profiler tab now browses all valid index rows (up to the 10000-record bound) 100 per page, newest first, through Newer/Older Requests buttons over the cached snapshot. Unreleased: fresh read-only source occurrence review for route/service/template literals, with exact source navigation and explicit partial coverage. Unreleased: selection-aware local raw/GZIP profiler collector overview through an optional isolated PHP adapter; modern virtual-type CSV support; endpoint labels retain handler methods. Unreleased profiler source ownership: explicit bounded project-relative CSV source setting, root/source-owned snapshots and source-scoped row keys; nested project ownership loss hides cached details. Unreleased service config workflow: explicit validated production PSR4 resource-load mode replaces the three native service-config template exports after reviewed atomic coverage; generic templates retained. Unreleased compiler workflow: reviewed Composer-owned compiler-pass creation replaces the native compiler template; selected production PSR4 directory/namespace and exact class preview. Unreleased file workflows: custom unambiguous production PSR4 sibling scaffolds and reviewed defaults-only YAML/XML/PHP service-config creation from composer.json, with source/target ownership and no guessed imports. Unreleased ownership audit: positive cached declaration hover, exact-domain fallback isolation and all unsafe host-index associations gated from automatic Rename; explicit source definition providers remain. 0.1.0: first release. This implementation works from a text index of the project, so the \
features that need PhpStorm's PSI are missing (container type inference, Doctrine, forms, most inspections). \
Unreleased: the Symfony tool window has Routes (a flat list: method icon, path, controller and route name, controller filter, flat or tree, Copy as curl and Create HTTP Request File on the row menu; optional clipboard and project.write) and Index sections; the unclosed-tag diagnostic moved to aritti.twig, which now reports it in Symfony projects too; project-wide Go to Declaration for service ids and route names (YAML and XML services, attribute, YAML and XML routes; @service, path() and generate() references) from the host's document index. \
Also new in this release (unverified in the IDE): Twig checks (assets tags, enum() classes, content outside blocks in extending templates, hard-coded paths with a quick fix); container reference checks (unknown %parameters%, missing service classes, deprecated classes) and service wiring checks (argument count and types, tag interfaces, listener methods, !php/const); practice hints and more version-gated deprecations for PHP; Doctrine removed-API checks; typo quick fixes for routes, templates, keys and domains; rewrites (Doctrine alias to ::class, command to invokable, Twig extension to attributes); service definition, argument resync and tag generators; Extract translation and Add form fields actions; Twig variable collectors; attribute argument completion; index links for events, macros, voters and validators; extra file templates and the extraServiceFiles, extraRoutingFiles and practiceChecks settings. Unreleased (practice and wiring): 12 more constructor and controller practice hints, deprecation checks (Routing Annotation Route, first-class callables, renderForm, constraint option arrays), Doctrine QueryBuilder, lifecycle visibility and discriminator-map checks, PHP service configuration and XML constant checks, Autowire service type check, XML service tags and arguments, Move property to the constructor, imported macro and constraint message completion, event and role values for attributes, and the Make, Create Twig Template and Insert Form Rows commands; template creation now uses reviewed FileActions. Also from the index: console command names, %parameters%, filters, functions and tests of the project's Twig extensions, UX Twig components and Stimulus controllers; gutter markers moved onto the index, so a template lists all its controllers, a block all its overriding templates and a route its path() uses. New commands: Run Console Command, Go to Route, Service, Console Command and Template, Extend Twig Template. Fixed: the document indexer no longer burns the CPU budget on minified single-line files (quote scan was quadratic)."""
categories = ["frameworks"]
icon = "icon.svg"
engines.openidea = "^1.9"
wasm = "dist/plugin.wasm"
activation = ["on-view:symfony", "on-file:**/composer.json", "on-language:php", "on-language:twig", "on-language:yaml", "on-language:xml"]

[capabilities]
required = ["project.read"]
# Cache: Warm Up / Clear run `php bin/console`; everything else works without it.
# process:symfony: the Processes tab opens `symfony serve` / `symfony server:log` in a terminal tab; Messenger and scheduler workers use process:php.
# editor.*: Twig: Extend Template inserts the extends tag.
# events: cross-file problems refresh on open/save; source-local syntax uses the live provider.
# Missing-template creation uses reviewed native FileActions, with no process grant.
optional = ["project.write", "process:php", "process:symfony", "events", "editor.read", "editor.write", "clipboard", "storage"]


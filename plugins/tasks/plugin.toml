id = "aritti.tasks"
name = "Tasks"
version = "0.3.0" # x-release-please-version
description = """Work on one task at a time. Create local tasks or pick issues from GitHub, GitLab, Codeberg, YouTrack Cloud, Jira Cloud and Trello. With git, each task can have its own branch and shelved changes. Switching back to a task reopens its files. The plugin tracks the time spent on each task, closes tasks (optionally resolving the issue and merging the branch), opens issues in the browser and copies the active task's commit message."""
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
homepage = "https://github.com/arnaud-ritti/openidea-plugins/tree/main/plugins/tasks"
license = "MIT"
change-notes = """Unreleased: a self-hosted YouTrack host (any DNS name) works through the optional net:ask grant, approved in the host dialog at first use; unattended refreshes just report it as denied. Unreleased: Jira Search Issues accepts owned JQL via a `jql:` prefix (<=256 bytes, no control chars, balanced quotes/parentheses, no dangling operator, single trailing ORDER BY field [ASC|DESC] list) with clear local refusals; the server still validates semantics. Unreleased: user-declared Generic REST/Java-regex tracker family (search and reviewed close) through the same private credential-profile bridge. Unreleased: explicit multi-profile self-hosted Redmine/MantisBT search with actual metadata/pagination and reviewed close (Redmine allowed-status fresh reads; Mantis strong ETag); credentials stay in externally provisioned private Python bridge profiles. Unreleased: explicit FogBugz Cloud search and reviewed optimistic close through an approved Python3 credential-profile bridge; no token enters native settings/logs and automatic refresh never launches the helper. Unreleased: documented Lighthouse Cloud search, descriptions and reviewed close with tenant/project identity and optional secret-header transport. Unreleased: tracker descriptions are retained as bounded plaintext (Jira ADF flattened) for cached issue hover and task description tabs. Optional closed GitHub/GitLab/Codeberg search with cache-policy isolation; automatic issue refresh remains open-only. \
Unreleased: native Tasks tree and scoped native review forms replace the packaged panel, with selection-aware Open/Switch/Reopen, explicit Close Active Task review, Search Issues and grouped Contexts entry points. Native window-scoped task status and owned open-editor named contexts with bounded active selection restoration (API 1.4). task/context storage now carries concrete owner/schema/revision, validates legacy records and bounds without silent reset, rejects stale rendered callbacks and supports explicit project-only recovery. Tasks: Search Issues asks for a query, searches every set-up tracker and opens the picked issue. Save, Load and Remove Context keep named lists of the open files. Add and Remove Repository read issues from several GitHub, GitLab or Codeberg repositories. \
0.2.0: Tasks: Switch Task picks a task from a list; Close Active Task brings the Tasks view to the front. Needs OpenIDEA API 1.2. \
0.1.0: first release. \
Local tasks, task switching and time tracking. Issues from GitHub, gitlab.com, codeberg.org, *.youtrack.cloud, \
*.atlassian.net and Trello, updated every 20 minutes. With git: a branch per task, shelving, and merging on close. \
Closing a task can update the issue state; work time can be posted to YouTrack and Jira. Each task reopens its files. \
The active task's commit message goes to the clipboard or to commit.template."""
categories = ["tools", "vcs"]
icon = "icon.svg"
engines.openidea = "^1.9"
wasm = "dist/plugin.wasm"
activation = ["on-view:tasks", "on-startup-finished", "on-schedule:1200", "on-event:file-opened"]

[capabilities]
required = ["project.read", "storage"]
# vcs.read: tracker remotes/current commit draft. vcs.write: explicit reviewed commit-message replacement.
# clipboard: Copy Commit Message.
# process:git: a branch per task, shelving, merge on close, commit.template. events: the files of each task.
# net + secrets: issue trackers, each one works on its own. net:ask: a self-hosted YouTrack host you configure, approved by you at first use.
optional = [
    "editor.read",
    "vcs.read",
    "vcs.write",
    "process:git",
    "process:python3",
    "events",
    "clipboard",
    "secrets",
    "net:api.github.com",
    "net:gitlab.com",
    "net:codeberg.org",
    "net:*.youtrack.cloud",
    "net:*.atlassian.net",
    "net:api.trello.com",
    "net:*.lighthouseapp.com",
    "net:ask",
]

[[contributes.secrets]]
name = "github-token"
label = "GitHub token"
description = "A GitHub personal access token that can read the repository's issues. Closing issues also needs write access."

[[contributes.secrets]]
name = "gitlab-token"
label = "GitLab token"
description = "A gitlab.com personal access token with the read_api scope, or the api scope to close issues."

[[contributes.secrets]]
name = "forgejo-token"
label = "Codeberg token"
description = "A codeberg.org access token with read:issue, or write:issue to close issues."

[[contributes.secrets]]
name = "youtrack-token"
label = "YouTrack token"
description = "A YouTrack permanent token (it starts with perm:). Create one under your profile › Account Security."

[[contributes.secrets]]
name = "jira-token"
label = "Jira credentials"
description = "Your Atlassian account email and API token as email:api-token, encoded in Base64 (the value sent for Basic authentication)."

[[contributes.secrets]]
name = "trello-key"
label = "Trello API key"
description = "The API key of your Trello Power-Up (trello.com/power-ups/admin)."

[[contributes.secrets]]
name = "trello-token"
label = "Trello token"
description = "A Trello token generated for that API key."


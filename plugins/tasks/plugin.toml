id = "aritti.tasks"
name = "Tasks"
version = "0.4.0" # x-release-please-version
description = """Work on one task at a time. Create local tasks or pick issues from GitHub, GitLab, Codeberg, YouTrack Cloud, Jira Cloud and Trello. With git, each task can have its own branch and shelved changes. Switching back to a task reopens its files. The plugin tracks the time spent on each task, closes tasks (optionally resolving the issue and merging the branch), opens issues in the browser and copies the active task's commit message."""
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
homepage = "https://github.com/arnaud-ritti/openidea-plugins/tree/main/plugins/tasks"
license = "MIT"
change-notes = """\
Next release: The active task in the status bar opens a menu to copy its commit message, close it or switch tasks, and a Tasks tab in Search Everywhere switches to the task you choose. Closing a task says when it worked, the merge option says it also deletes the branch, a denied tracker update is reported, and the empty Issues row says why it is empty; self-hosted YouTrack, Redmine, MantisBT, FogBugz, Lighthouse and custom REST trackers, and Jira search accepts JQL with a jql: prefix; issue descriptions show on hover and in task tabs, and tracker credentials are sent only to the configured tracker server; an update where one tracker fails keeps that tracker's issues, GitHub issues from several repositories get distinct ids, and the commit template works in a repository with no commits; Open Task reveals the Tasks window when it needs its form, New Task gets Alt+Shift+K, the toolbar moves Search Issues, Update Issues and contexts into More…, caret commands need a focused editor, and plainer confirmations, settings and permission messages. \
0.3.0: more trackers and closed-issue search. \
0.2.0: plugin icon and task tree."""
categories = ["tools", "vcs"]
icon = "icon.svg"
engines.openidea = "^1.14"
wasm = "dist/plugin.wasm"
activation = ["on-view:tasks", "on-startup-finished", "on-schedule:1200", "on-event:file-opened"]

[capabilities]
required = ["project.read", "storage"]
# vcs.read: tracker remotes/current commit draft. vcs.write: explicit reviewed commit-message replacement.
# clipboard: Copy Commit Message.
# process:git: a branch per task, shelving, merge on close, commit.template. events: the files of each task.
# net + secrets: issue trackers, each one works on its own. net:ask: a self-hosted YouTrack host you configure, approved by you at first use.
optional = [
    "editor.read",
    "vcs.read",
    "vcs.write",
    "process:git",
    "process:python3",
    "events",
    "clipboard",
    "secrets",
    "net:api.github.com",
    "net:gitlab.com",
    "net:codeberg.org",
    "net:*.youtrack.cloud",
    "net:*.atlassian.net",
    "net:api.trello.com",
    "net:*.lighthouseapp.com",
    "net:ask",
]

[[contributes.secrets]]
name = "github-token"
label = "GitHub token"
description = "A GitHub personal access token that can read the repository's issues. Closing issues also needs write access."

[[contributes.secrets]]
name = "gitlab-token"
label = "GitLab token"
description = "A gitlab.com personal access token with the read_api scope, or the api scope to close issues."

[[contributes.secrets]]
name = "forgejo-token"
label = "Codeberg token"
description = "A codeberg.org access token with read:issue, or write:issue to close issues."

[[contributes.secrets]]
name = "youtrack-token"
label = "YouTrack token"
description = "A YouTrack permanent token (it starts with perm:). Create one under your profile › Account Security."

[[contributes.secrets]]
name = "jira-token"
label = "Jira credentials"
description = "Your Atlassian account email and API token as email:api-token, encoded in Base64 (the value sent for Basic authentication)."

[[contributes.secrets]]
name = "trello-key"
label = "Trello API key"
description = "The API key of your Trello Power-Up (trello.com/power-ups/admin)."

[[contributes.secrets]]
name = "trello-token"
label = "Trello token"
description = "A Trello token generated for that API key."


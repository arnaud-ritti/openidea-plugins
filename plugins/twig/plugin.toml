id = "aritti.twig"
name = "Twig"
version = "0.1.0" # x-release-please-version
description = "Twig support for .twig files: highlighting of Twig and the HTML around it, blocks and macros in the structure view, and folding of tag pairs and multi-line comments."
authors = ["Arnaud Ritti <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = "0.1.0: first release, with .twig file detection, highlighting, structure view and folding."
categories = ["languages"]
engines.openidea = "^1.0"
# Highlighting, structure and folding come from this component; it is loaded
# when the first Twig file is opened.
wasm = "dist/plugin.wasm"
activation = ["on-language:twig"]

[[contributes.languages]]
path = "languages/twig.toml"

[[contributes.fileIcons]]
id = "twig"
patterns = ["*.twig"]
icon = "icons/twig.svg"
iconDark = "icons/twig_dark.svg"

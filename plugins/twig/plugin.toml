id = "aritti.twig"
name = "Twig"
version = "0.1.0" # x-release-please-version
description = "Twig support for .twig files: highlighting of Twig and the HTML around it, blocks and macros in the structure view, folding of tag pairs and multi-line comments, completion of tags, filters, functions and tests, thirteen snippets (blk, mcr, esc, emb, ext, for, from, if, imp, inc, sbx, spl, verb), and inspections for unclosed tags, unexpected end tags and unterminated delimiters."
authors = ["Arnaud Ritti <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = "Unreleased: completion of Twig tags, filters, functions and tests, and thirteen snippets (blk, mcr, esc, emb, ext, for, from, if, imp, inc, sbx, spl, verb) in HTML text; inspections for unclosed tags, end tags without an opening tag and unterminated {{, {% and {# (setting 'diagnostics'). In a Symfony project (symfony.lock or symfony/framework-bundle in composer.json) name completion is left to aritti.symfony so nothing is listed twice; unclosed-tag is reported here in every project. No formatter: OpenIDEA only drives Prettier and Ruff from a language definition, and neither parses Twig. 0.1.0: 0.1.0: first release, with .twig file detection, highlighting, structure view and folding."
categories = ["languages"]
engines.openidea = "^1.2"
# Highlighting, structure and folding come from this component; it is loaded
# when the first Twig file is opened.
wasm = "dist/plugin.wasm"
activation = ["on-language:twig"]

[capabilities]
required = ["project.read"]
# events: the inspections run when a Twig file is opened or saved.
optional = ["events"]

[contributes.settings]
schema = "settings.schema.json"
title = "Twig"

[[contributes.providers]]
kinds = ["completion"]
languages = ["twig"]

[[contributes.languages]]
path = "languages/twig.toml"

[[contributes.fileIcons]]
id = "twig"
patterns = ["*.twig"]
icon = "icons/twig.svg"
iconDark = "icons/twig_dark.svg"
